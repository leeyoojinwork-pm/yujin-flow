{notes:"Multi Agent의 증거물 장표. 왼쪽이 쓴 것, 오른쪽이 지적한 것. 수강생 한 명에게 자기 review.md의 지적 한 줄을 소리 내어 읽게 하면 체감이 확 온다. 마지막 줄이 오늘의 핵심 메시지다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">Multi Agent · 결과</div>\n  <div class=\"h2\" style=\"font-size:25px;\">파일 두 개 = Multi Agent</div>\n  <div class=\"sub\">파일 두 개가 나란히 있으면 됩니다. 하나는 만든 것, 하나는 그걸 검사한 것.</div>\n  <div class=\"g2\" style=\"margin-top:14px;\">\n    <div class=\"card bl\" style=\"min-height:180px;\"><div class=\"ctag bl\">1번 방이 만든 것 · draft.md</div>\n      <div class=\"cb mono\" style=\"font-size:12.5px;line-height:1.7;background:rgba(0,0,0,.25);border-radius:7px;padding:10px 12px;margin-top:6px;\">\n        결정사항<br/>· 2월 캠페인 예산 확정<br/>· 담당자 배정 완료<br/><br/>다음 할 일<br/>· 소재 초안 공유</div></div>\n    <div class=\"card pu\" style=\"min-height:180px;\"><div class=\"ctag pu\">2번 방이 찾은 것 · review.md</div>\n      <div class=\"cb\" style=\"margin-top:6px;\">\n        <table class=\"tbl\" style=\"font-size:11.5px;\"><thead><tr><th>어디가</th><th>뭐가 문제</th></tr></thead>\n        <tbody><tr><td>담당자 배정</td><td>원문에 이름이 없음</td></tr>\n        <tr><td>다음 할 일</td><td>기한이 빠짐</td></tr></tbody></table></div></div>\n  </div>\n  <div class=\"cl am\" style=\"margin-top:12px;\"><strong>draft.md는 그대로입니다.</strong> 지적만 하고 안 고쳤습니다.</div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">한 방에서 했으면</div><div class=\"bmtxt\"><span class=\"hl\">이 지적은 안 나옵니다</span></div></div>\n</div>"},
{notes:"완성 장표. 오늘 60분의 결과가 이 한 장이다. 아래 문장(대화는 안 넘어가고 파일만 넘어간다)이 오늘의 요약이다. 다음 주 발표에서 이 그림을 그대로 쓰라고 말해준다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">아키텍처 완성</div>\n  <div class=\"h2\" style=\"font-size:25px;\">방 2개 + 폴더 1개</div>\n  <div class=\"demo\" style=\"margin-top:12px;padding:14px 18px;\">\n    <div class=\"dlbl\">방</div>\n    <div style=\"display:flex;gap:12px;\"><div class=\"agbox\" style=\"flex:1;animation-delay:0.1s;text-align:center;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.04);\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">1번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;\">초안을 씁니다</div></div><div class=\"agbox\" style=\"flex:1;animation-delay:0.35s;text-align:center;border-color:#7C3AED;background:rgba(124,58,237,.14);\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">2번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;\">지적만 합니다</div></div></div>\n    <div style=\"text-align:center;font-size:12px;color:#A78BFA;margin:10px 0 8px;\">↓&nbsp;&nbsp;두 방이 같은 폴더를 봅니다&nbsp;&nbsp;↓</div>\n    <div class=\"dlbl\">폴더 — 둘이 같이 쓰는 폴더</div>\n    <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:11px 14px;\"><div class=\"fline\" style=\"animation-delay:0.5s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">내_업무_폴더/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\"></span></div><div class=\"fline\" style=\"animation-delay:0.5700000000000001s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── CLAUDE.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이 방의 규칙. 모든 대화가 먼저 읽습니다</span></div><div class=\"fline\" style=\"animation-delay:0.64s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── background.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">내 업무 배경 — 지난주 대화에서 옮겨온 것</span></div><div class=\"fline\" style=\"animation-delay:0.71s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── SKILL.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">일하는 순서 다섯 칸</span></div><div class=\"fline\" style=\"animation-delay:0.78s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── input/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이번에 처리할 원본 자료</span></div><div class=\"fline\" style=\"animation-delay:0.8500000000000001s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">└── output/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">결과물이 나오는 곳</span></div><div class=\"fline\" style=\"animation-delay:0.92s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    ├── draft.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">1번 방이 낸 초안</span></div><div class=\"fline\" style=\"animation-delay:0.99s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    └── review.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">2번 방이 낸 지적 목록<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;\">NEW</span></span></div></div>\n  </div>\n</div>"},
{notes:"실패 패턴 3가지. 다음 주에 혼자 늘릴 때 반드시 밟는 지뢰라 미리 깔아둔다. 특히 과다 위임 - 2~3개로 시작하라는 말을 강조한다. 오늘 2개 만든 게 적은 게 아니라 맞는 크기라고 말해주면 안심한다.",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">주의 · 실패 패턴</div>\n  <div class=\"h2\" style=\"font-size:25px;\">완료 기준 · 과다 위임 · 맥락 누락</div>\n  <div class=\"g3\" style=\"margin-top:16px;\">\n    <div class=\"card rd\"><div class=\"ctag rd\">01 완료 기준 부족</div><div class=\"ct\">\"언제 끝난 건지\"를 안 알려줌</div><div class=\"cb\">대충 끝내거나 끝없이 계속합니다. 각 방에 <strong>무엇이 나오면 끝인지</strong>를 한 줄로 적어주세요.</div></div>\n    <div class=\"card rd\"><div class=\"ctag rd\">02 과다 위임</div><div class=\"ct\">너무 잘게 쪼갬</div><div class=\"cb\">방이 많아질수록 관리가 더 어려워집니다. <strong>2~3개로 시작하세요.</strong> 오늘 만든 2개는 적은 게 아니라 맞는 크기입니다.</div></div>\n    <div class=\"card rd\"><div class=\"ctag rd\">03 맥락 누락</div><div class=\"ct\">배경을 안 주고 일만 시킴</div><div class=\"cb\">엉뚱한 결과가 나옵니다. 새 방을 열 때마다 <strong>background.md를 읽게</strong> 하세요. 오늘 이전 프롬프트를 쓴 이유입니다.</div></div>\n  </div>\n  <div class=\"cl am\">셋 다 <strong>안 적어서</strong> 생깁니다. 머릿속에 있는 건 새 방에 안 넘어갑니다.</div>\n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 손을 멈추고 제 화면만 봐주세요.",html:"<div class=\"inner divslide\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">05</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">시연 · 52–56분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">둘이 일하는 걸 눈으로 봅니다</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">손을 멈추고 제 화면만 봐주세요.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 2</div>\n    </div>\n  </div>\n</div>"},
{notes:"위는 수강생이 실제로 보는 화면(명령어 실행 중 2분 26초), 아래는 같은 일이 캐릭터로 보이는 화면. 이 대비가 이 장표의 전부다. 위쪽을 먼저 짚고 \"이거 답답하셨죠\" 한 마디 하고 아래로 내려간다. 픽셀 설치 방법은 말로만 안내한다(강의 후 따로 보내드린다고).",html:"<div class=\"inner\"><div class=\"kicker\">시연 · 문제</div>\n  <div class=\"h2\">일하는 게 안 보입니다</div>\n  <div class=\"sub\">손을 멈추고 제 화면을 봐주세요. 여러분이 방금 돌린 것과 똑같은 구조입니다. 차이는 캐릭터가 보인다는 것뿐입니다.</div><div style=\"display:grid;grid-template-columns:1.25fr .85fr;gap:22px;align-items:start;margin-top:12px;\"><div>\n  <div class=\"ba\" style=\"margin-top:14px;\">\n    <div class=\"bef\"><div class=\"balbl b\">여러분 화면</div><div class=\"batask\">\"명령어 실행 중…\" 이 전부</div><div class=\"babody\">누가 지금 뭘 하는지, 둘 중 누가 멈춰 있는지 알 수가 없습니다. 둘이 나눠서 일한다는 말이 잘 안 와닿습니다.</div></div>\n    <div class=\"aft\"><div class=\"balbl a\">제 화면</div><div class=\"batask\">작은 캐릭터로 나타납니다</div><div class=\"babody\">자기 책상으로 걸어가 앉고, 파일을 쓸 때는 타자를 치고, 뭔가 찾을 때는 읽는 동작을 합니다. 둘이면 캐릭터도 둘입니다.</div></div>\n  </div>\n  \n</div><div><div class=\"demo card-pop\" style=\"animation-delay:.1s;background:#101826;\">\n  <div class=\"dlbl\">여러분 화면 — 실제로 이렇게 보입니다</div>\n  <div class=\"mono\" style=\"font-size:11.5px;background:rgba(0,0,0,.3);border-radius:8px;padding:10px 12px;\">\n    <div class=\"fline\" style=\"animation-delay:.3s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>명령 5개 실행함</div>\n    <div class=\"fline\" style=\"animation-delay:.7s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>명령 실행함</div>\n    <div class=\"fline\" style=\"animation-delay:1.1s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>명령 실행함</div>\n    <div class=\"fline\" style=\"animation-delay:1.5s;color:rgba(252,211,77,.9)\"><i style=\"background:#78350F\"></i>명령어 실행 중… · 2분 26초</div>\n  </div>\n  \n  <div class=\"cl am\" style=\"margin:8px 0 10px;font-size:11.5px;\">누가 뭘 하는 중인지, 어디서 멈췄는지 <strong>알 수가 없습니다.</strong></div><div class=\"dlbl\">제 화면 — 같은 일인데 이렇게 보입니다</div>\n  <div class=\"deskwrap\">\n    <div class=\"desk\">\n      <div class=\"guy g1\" style=\"background:#60A5FA;\"></div><div class=\"deskplate\"></div>\n      <div style=\"font-size:10.5px;color:rgba(255,255,255,.5);margin-top:5px;\">1번 방</div>\n    </div>\n    <div class=\"desk\">\n      <div class=\"say\">기다리는 중</div>\n      <div class=\"guy g2\" style=\"background:#C4B5FD;\"></div><div class=\"deskplate\"></div>\n      <div style=\"font-size:10.5px;color:rgba(255,255,255,.5);margin-top:5px;\">2번 방</div>\n    </div>\n  </div>\n  <div style=\"font-size:11.5px;color:rgba(255,255,255,.5);text-align:center;\">위아래로 움직이면 타자를 치는 중입니다</div>\n</div></div></div></div>"},
{notes:"세 가지를 짚으며 보여준다. 특히 말풍선. 안전을 말로 설명하면 안 외워지는데 기다리는 캐릭터를 한 번 보면 잊지 않는다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">시연 · 볼 것 3가지</div>\n  <div class=\"h2\">타자 · 말풍선 · 순서</div>\n  <div class=\"g3\" style=\"margin-top:16px;\">\n    <div class=\"card bl\"><div class=\"ctag bl\">01</div><div class=\"ct\">타자를 치는 캐릭터</div><div class=\"cb\">지금 파일을 쓰고 있습니다. 여러분 화면에서 글자가 흘렀던 바로 그 순간입니다.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">02</div><div class=\"ct\">머리 위 말풍선</div><div class=\"cb\"><strong>사람 허락을 기다리는 중입니다.</strong> 사람이 확인해야 할 지점이 눈에 보이는 순간입니다.</div></div>\n    <div class=\"card am\"><div class=\"ctag am\">03</div><div class=\"ct\">순서대로 움직임</div><div class=\"cb\">1번 방이 끝나야 2번 방이 시작합니다. 순서가 눈에 보입니다.</div></div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">이게 오늘의 진짜 수확</div><div class=\"bmtxt\"><span class=\"hl\">역할 분리</span>가 방 두 개로 보입니다</div></div>\n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 가져가실 게 폴더 하나로 정리돼 있습니다.",html:"<div class=\"inner divslide\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">06</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">마무리 · 56–60분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">오늘 남은 것과 다음 주</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">가져가실 게 폴더 하나로 정리돼 있습니다.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 2</div>\n    </div>\n  </div>\n</div>"},
{notes:"화면을 같이 보면서 하나씩 짚는다. 설계서가 아니라 실제로 생긴 파일이라는 점을 강조한다. 이 폴더를 통째로 들고 가는 게 오늘의 결과물이다. (말로: 설계서나 계획서가 아닙니다. 실제로 생긴 파일입니다. 이 폴더를 통째로 들고 가시면 됩니다.)",html:"<div class=\"inner\">\n  <div class=\"kicker\">마무리 · 산출물</div>\n  <div class=\"h2\">오늘 남은 파일</div>\n  <table class=\"tbl\" style=\"margin-top:10px;\">\n    <thead><tr><th style=\"width:200px\">파일</th><th>무슨 뜻인가</th></tr></thead>\n    <tbody>\n      <tr><td>background.md</td><td>지난주에 한 이야기가 한 장으로 정리됐습니다</td></tr>\n      <tr><td>폴더 네 칸 + CLAUDE.md</td><td>매번 하던 설명이 파일로 내려갔습니다</td></tr>\n      <tr><td>SKILL.md</td><td>내 머릿속 순서가 밖으로 나왔습니다</td></tr>\n      <tr class=\"focal\"><td class=\"done\">draft.md + review.md</td><td class=\"done\">둘이 나눠서 실제로 한 번 돌아갔습니다</td></tr>\n    </tbody>\n  </table>\n  \n</div>"},
{notes:"돌아가기 시작한 순간부터 더 중요해진다. 특히 첫 번째. 이건 내가 지금도 지키는 원칙이라고 말해주면 설득력이 있다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">마무리 · 금지선</div>\n  <div class=\"h2\">돌리기 전에 막아둘 3가지</div>\n  <table class=\"tbl\" style=\"margin-top:10px;\">\n    <thead><tr><th style=\"width:170px\">지킬 것</th><th style=\"width:300px\">뭐가 위험한가</th><th>어떻게 막나</th></tr></thead>\n    <tbody>\n      <tr><td>되돌릴 수 없는 일</td><td>메일 발송, 파일 삭제, 일정 등록, 외부 게시</td><td>AI가 알아서 못 하게 하고 <strong>내가</strong> 누른다</td></tr>\n      <tr><td>없는 숫자와 출처</td><td>그럴듯하게 지어내면 걸러내기 어렵다</td><td>CLAUDE.md에 한 줄 — 확인 못 한 건 모른다고 쓴다</td></tr>\n      <tr><td>개인정보</td><td>연락처·계좌·주민번호가 그대로 들어간다</td><td>input에 넣기 전에 가리고 넣는다</td></tr>\n    </tbody>\n  </table>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">기억할 한 줄</div><div class=\"bmtxt\">많이 맡기는 것보다<br/><span class=\"hl\">어디서 멈추게 할지</span>가 중요합니다.</div></div>\n</div>"},
{notes:"오늘의 최종 목표 장표. 여기서 30초 멈추고 직접 채우게 한다. 다음 주 발표 자료가 이 그림이다.",html:"<div class=\"inner\" style=\"max-width:940px;\">\n  <div class=\"kicker\">마무리 · 최종 목표</div>\n  <div class=\"h2\" style=\"font-size:25px;\">내 업무 구조도 그리기</div>\n  <div class=\"sub\">툴 쓰는 법보다 <strong>내 업무를 이렇게 쪼갤 줄 아는 것</strong>이 오늘 핵심입니다.</div>\n  <div style=\"margin-top:16px;\"><div class=\"demo\" style=\"padding:14px 16px;\">\n      <div class=\"dlbl\">빈칸을 채워보세요</div>\n      <div class=\"mono\" style=\"font-size:13px;line-height:2.1;color:rgba(255,255,255,.7);\">\n<div class=\"fline\" style=\"animation-delay:.2s\">[&nbsp;내 업무 이름&nbsp;] Agent</div>\n<div class=\"fline\" style=\"animation-delay:.5s;color:#C4B5FD;\">├── [&nbsp;담당 1&nbsp;] 방 &nbsp;<span style=\"font-size:11px;color:rgba(255,255,255,.4);\">— 무엇을 내나</span></div>\n<div class=\"fline\" style=\"animation-delay:.7s;color:rgba(110,231,183,.85);\">│&nbsp;&nbsp;&nbsp;└── [&nbsp;그 방이 쓰는 방법&nbsp;] Skill</div>\n<div class=\"fline\" style=\"animation-delay:.9s;color:#C4B5FD;\">└── [&nbsp;담당 2&nbsp;] 방 &nbsp;<span style=\"font-size:11px;color:rgba(255,255,255,.4);\">— 무엇을 보나</span></div>\n<div class=\"fline\" style=\"animation-delay:1.1s;color:rgba(110,231,183,.85);\">&nbsp;&nbsp;&nbsp;&nbsp;└── [&nbsp;그 방이 쓰는 방법&nbsp;] Skill</div>\n      </div>\n      </div></div></div>"},
{notes:"그리는 순서 네 단계와 나누는 기준 둘. 1번이 핵심이다 — 중간에 나오는 파일부터 적는다. 다음 주에 가져올 건 이 그림 한 장이라고 닫는다.",html:"<div class=\"inner\" style=\"max-width:1020px;\">\n  <div class=\"kicker\">마무리 · 그리는 순서</div>\n  <div class=\"h2\" style=\"font-size:25px;\">네 단계</div>\n  <div style=\"margin-top:18px;\">\n    <div class=\"step\"><div class=\"sn\">1</div><div class=\"st\">일 중간에 <strong>나오는 파일을 먼저</strong> 적는다</div></div>\n    <div class=\"step\"><div class=\"sn\">2</div><div class=\"st\">그 파일을 기준으로 <strong>앞뒤를 방으로</strong> 나눈다</div></div>\n    <div class=\"step\"><div class=\"sn\">3</div><div class=\"st\">각 방에 <strong>\"무엇이 나오면 끝인지\"</strong>를 한 줄 적는다</div></div>\n    <div class=\"step\"><div class=\"sn\">4</div><div class=\"st\">방이 쓰는 <strong>방법을 Skill로</strong> 붙인다</div></div>\n  </div>\n  <div class=\"cl pu\">나누는 기준은 둘 중 하나입니다. <strong>전문성</strong>(봐야 할 지식이 다를 때) 또는 <strong>업무 단계</strong>(순서가 있을 때).</div>\n</div>"},
{notes:"다음 주가 최종 발표. 발표 네 항목이 오늘 실습 네 개와 그대로 대응한다는 게 핵심 메시지다. 오른쪽 열을 손으로 짚으면서 읽어주면 오늘 한 게 전부 발표 재료였다는 게 보인다. 4번 숫자만 다음 주까지 재오면 된다고 마무리하고 질문 받는다. (말로: 오늘 폴더에 생긴 파일이 1·2·3번 전부입니다. 다음 주까지 4번 숫자만 한 번 재오시면 됩니다.)",html:"<div class=\"inner\" style=\"max-width:1100px;\">\n  <div class=\"kicker\">마무리 · 다음 주</div>\n  <div class=\"h2\" style=\"font-size:25px;\">내 Agent 발표</div>\n  <div class=\"sub\">발표할 네 가지가 오늘 만든 것과 그대로 맞물립니다. 새로 만드실 것 없습니다.</div>\n  <table class=\"tbl\" style=\"margin-top:12px;\">\n    <thead><tr><th style=\"width:130px\">발표 항목</th><th style=\"width:400px\">뭘 말하나</th><th>오늘 어디서 만들었나</th></tr></thead>\n    <tbody>\n      <tr><td><strong>1. 무엇을</strong></td><td>어떤 업무의 무엇을 대신하는 Agent인가. 한 문장으로</td><td class=\"done\">준비 ① — background.md</td></tr>\n      <tr><td><strong>2. 어떻게 설계했나</strong></td><td>지침에 뭘 넣었고, 일하는 순서를 어떻게 짰는지</td><td class=\"done\">준비 ②·2 — CLAUDE.md, SKILL.md</td></tr>\n      <tr class=\"focal\"><td class=\"done\"><strong>3. 멀티는 어떻게</strong></td><td class=\"done\">몇 명으로 나눴고, 각자 뭘 보고 <strong>뭘 못 하게 했는지.</strong> 그리고 왜 나눴는지</td><td class=\"done\">Multi Agent 만들기 — writer / reviewer</td></tr>\n      <tr><td><strong>4. 결과</strong></td><td>실제로 돌아간 결과물과, 시간이 얼마나 줄었는지</td><td class=\"warn\">draft.md·review.md + 숫자는 다음 주까지</td></tr>\n    </tbody>\n  </table>\n  <div class=\"g2\" style=\"margin-top:14px;\">\n    <div class=\"card pu\"><div class=\"ctag pu\">3번에서 제일 중요한 것</div><div class=\"cb\">몇 명인지보다 <strong>왜 나눴는지</strong>입니다. 섞으면 뭐가 흐려지던가요. 그 한 문장이 발표의 핵심입니다.</div></div>\n    <div class=\"card am\"><div class=\"ctag am\">4번 숫자 재는 법</div><div class=\"cb\">기존에 걸리던 시간에서 <strong>AI 처리 시간과 내 검수 시간</strong>을 뺍니다. 거기에 주에 몇 번 하는지 곱하고요. 검수 시간을 빼면 숫자가 거짓말이 됩니다.</div></div>\n  </div>\n  \n</div>"}
];

/* 도입부 재구성: 비유보다 업무 단위·행동·산출물을 먼저 제시 */
SLIDES[0] = {notes:"오늘은 AI 한 명에게 맡기던 일을 두 역할로 나눕니다. 첫 번째 AI가 초안을 만들고, 두 번째 AI가 내용을 확인합니다.",html:`<div class="inner cover-inner" style="max-width:1160px;">

/* 60분 입문 강의용 30장 버전: 중복 설명·간지·확장 개념은 덜어내고 핵심 흐름만 유지 */
const KEEP_SLIDES = [0,1,2,3,4,5,16,17,18,19,24,26,28,30,31,34,36,37,38,39,41,42,43];
SLIDES.splice(0, SLIDES.length, ...KEEP_SLIDES.map(i => SLIDES[i]));
const BEGINNER_TITLES = [
  ['섞이면 안 되는 판단이 둘 이상일 때','작성과 확인을 나누면 실수가 줄어듭니다'],
  ['지난주 이야기를 파일 한 장으로','지난주에 했던 일을 먼저 정리합니다'],
  ['머릿속 기준을 글로 꺼냈더니','내가 하던 일을 글로 적으면 AI가 따라 할 수 있습니다'],
  ['Agent를 만듭니다','AI가 정해진 순서대로 일하게 만듭니다'],
  ['스스로 다시 확인하면 Agent','AI가 결과를 다시 확인해야 Agent가 됩니다'],
  ['일하는 순서를 다섯 칸으로','AI가 일할 순서를 다섯 줄로 적습니다'],
  ['Agent 하나 완성','AI 한 명이 자료를 읽고 결과 파일을 만듭니다'],
  ['방을 하나 더 엽니다','두 번째 AI에게 첫 번째 결과를 확인하게 합니다'],
  ['Head 하나 + Sub 여럿','큰 일을 작은 담당으로 나눌 수 있습니다'],
  ['대화는 안 넘어가고 파일만 넘어간다','두 번째 AI에게는 결과 파일만 전달됩니다'],
  ['이렇게 나눕니다','앞에서 만든 파일을 뒤의 AI가 확인하게 합니다'],
  ['파일 두 개 = Multi Agent','초안 파일과 확인 파일이 생기면 Multi Agent입니다'],
  ['완료 기준 · 과다 위임 · 맥락 누락','AI에게 일을 시킬 때 세 가지만 먼저 정합니다'],
  ['돌리기 전에 막아둘 3가지','메일 발송과 개인정보는 AI가 마음대로 처리하지 않습니다'],
  ['내 업무 구조도 그리기','내 일을 작성과 확인으로 나눠 그려봅니다']
];
BEGINNER_TITLES.forEach(([from, to]) => {
  SLIDES.forEach(slide => { slide.html = slide.html.replace(from, to); });
});

/* 도입부 전용 구조 시각화 스타일 */

function fallback(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { alert('복사에 실패했습니다. 직접 선택해서 복사해주세요.'); }
  document.body.removeChild(ta);
}
const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
let cur = 0, notesOpen = false, tx = 0;

document.getElementById('tot').textContent = SLIDES.length;
SLIDES.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.id = 'sl' + i;
  div.innerHTML = s.html;
  div.querySelectorAll('pre.prompt').forEach(pre => {
    const wrap = document.createElement('div');
    wrap.className = 'promptwrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement('button');
    btn.className = 'copybtn';
    btn.type = 'button';
    btn.textContent = '복사';
    btn.onclick = () => {
      const txt = pre.innerText;
      const done = () => { btn.textContent = '복사됨'; btn.classList.add('done');
        setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('done'); }, 1600); };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(txt).then(done).catch(() => fallback(txt, done));
      } else { fallback(txt, done); }
    };
    wrap.appendChild(btn);
  });
  stage.appendChild(div);
  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' on' : '');
  dot.onclick = () => show(i);
  dotsEl.appendChild(dot);
});

function show(idx){
  idx = Math.max(0, Math.min(SLIDES.length - 1, idx));
  const prev = document.getElementById('sl' + cur);
  const next = document.getElementById('sl' + idx);
  if (prev && prev !== next) { prev.classList.remove('active'); prev.classList.add('exit'); setTimeout(() => prev.classList.remove('exit'), 380); }
  cur = idx;
  document.body.classList.toggle('character-on', [17,18,19].includes(cur));
  next.classList.remove('exit');
  next.classList.add('active');
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('pf').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('notesText').textContent = SLIDES[cur].notes || '—';
  document.getElementById('btnP').disabled = cur === 0;
  document.getElementById('btnN').disabled = cur === SLIDES.length - 1;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === cur));
  next.querySelectorAll('.demo, .demo *').forEach(el => { const a = el.style.animation; el.style.animation='none'; void el.offsetWidth; el.style.animation=a || ''; });
}
function go(d){ show(cur + d); }
function toggleNotes(){
  notesOpen = !notesOpen;
  document.getElementById('notesPanel').classList.toggle('open', notesOpen);
  document.getElementById('noteBtn').classList.toggle('on', notesOpen);
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
  if (e.key === 'Escape' && notesOpen) toggleNotes();
  if (e.key === 'n' || e.key === 'N') toggleNotes();
});
stage.addEventListener('touchstart', e => tx = e.touches[0].clientX);
stage.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); });
show(0);
</script>
