<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Single → Multi Agent — 60분 실습 특강 | 이유진</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;}
body{background:#0D1117;display:flex;flex-direction:column;}

/* ── Top bar ── */
.topbar{height:46px;flex-shrink:0;background:rgba(13,17,23,.97);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 22px;gap:12px;}
.tb-badge{background:#7C3AED;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;}
.tb-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);}
.tb-meta{font-size:11.5px;color:rgba(255,255,255,.3);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.tb-btn{background:none;border:1px solid rgba(255,255,255,.15);border-radius:5px;color:rgba(255,255,255,.45);font-size:11px;padding:4px 10px;cursor:pointer;transition:all .15s;}
.tb-btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3);}
.tb-btn.on{background:rgba(124,58,237,.2);border-color:#7C3AED;color:#C4B5FD;}
.dots{display:flex;gap:7px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:all .2s;border:none;}
.dot.on{background:#7C3AED;transform:scale(1.3);}
.counter{font-size:12px;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums;}

/* ── Progress ── */
.progress{height:3px;background:rgba(255,255,255,.06);flex-shrink:0;}
.pfill{height:100%;background:linear-gradient(90deg,#7C3AED,#A78BFA);transition:width .4s cubic-bezier(.22,1,.36,1);}

/* ── Stage ── */
.stage{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 64px;opacity:0;transform:translateX(56px);transition:opacity .35s cubic-bezier(.22,1,.36,1),transform .35s cubic-bezier(.22,1,.36,1);pointer-events:none;overflow-y:auto;}
.slide.active{opacity:1;transform:translateX(0);pointer-events:auto;}
.slide.exit{opacity:0;transform:translateX(-56px);}
.inner{width:100%;max-width:840px;}

/* ── Nav arrows ── */
.arr{position:fixed;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:10;}
.arr:hover{background:rgba(255,255,255,.12);color:#fff;}
.arr:disabled{opacity:.15;cursor:default;}
.arr.p{left:13px;}
.arr.n{right:13px;}

/* ── Notes ── */
.notes{position:fixed;bottom:0;left:0;right:0;background:rgba(8,12,20,.97);border-top:1px solid rgba(255,255,255,.1);padding:13px 24px;font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.7;transform:translateY(100%);transition:transform .28s;max-height:140px;overflow-y:auto;}
.notes.open{transform:translateY(0);}
.nlbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A78BFA;margin-bottom:5px;}

/* ── Text ── */
.kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7C3AED;margin-bottom:10px;}
.h1{font-size:36px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:12px;}
.h2{font-size:23px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:5px;}
.sub{font-size:13px;color:rgba(255,255,255,.38);margin-bottom:18px;line-height:1.6;}

/* ── Cards ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.card{border-radius:10px;padding:16px 18px;}
.card.pu{background:rgba(124,58,237,.14);border:1px solid rgba(124,58,237,.32);}
.card.bl{background:rgba(37,99,235,.14);border:1px solid rgba(37,99,235,.32);}
.card.rd{background:rgba(185,28,28,.13);border:1px solid rgba(185,28,28,.28);}
.card.am{background:rgba(180,83,9,.16);border:1px solid rgba(252,211,77,.3);}
.card.gr{background:rgba(5,150,105,.13);border:1px solid rgba(5,150,105,.3);}
.card.sl{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);}
.ctag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;}
.ctag.pu{color:#C4B5FD;}.ctag.bl{color:#93C5FD;}.ctag.rd{color:#FCA5A5;}.ctag.am{color:#FCD34D;}.ctag.gr{color:#6EE7B7;}.ctag.sl{color:rgba(255,255,255,.35);}
.ct{font-size:15px;font-weight:700;color:#fff;margin-bottom:5px;line-height:1.35;}
.cb{font-size:13px;color:rgba(255,255,255,.58);line-height:1.75;}

/* ── BA ── */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bef{background:rgba(185,28,28,.12);border:1px solid rgba(185,28,28,.28);border-radius:8px;padding:14px 16px;}
.aft{background:rgba(124,58,237,.13);border:1px solid rgba(124,58,237,.32);border-radius:8px;padding:14px 16px;}
.balbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;}
.balbl.b{color:#FCA5A5;}.balbl.a{color:#C4B5FD;}
.batask{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.35;}
.babody{font-size:12.5px;color:rgba(255,255,255,.52);line-height:1.75;}

/* ── Callout ── */
.cl{border-radius:8px;padding:12px 16px;font-size:13.5px;line-height:1.75;margin-top:11px;}
.cl.pu{background:rgba(124,58,237,.14);border-left:3px solid #7C3AED;color:#DDD6FE;}
.cl.bl{background:rgba(37,99,235,.14);border-left:3px solid #2563EB;color:#BAE6FD;}
.cl.am{background:rgba(180,83,9,.16);border-left:3px solid #D97706;color:#FDE68A;}
.cl.gr{background:rgba(5,150,105,.13);border-left:3px solid #10B981;color:#6EE7B7;}

/* ── Step ── */
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 15px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;}
.sn{width:26px;height:26px;border-radius:50%;background:#7C3AED;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.st{font-size:13.5px;color:rgba(255,255,255,.73);line-height:1.7;}
.st strong{color:#fff;}

/* ── Rule tag ── */
.rtag{display:inline-flex;align-items:center;gap:5px;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.35);border-radius:5px;padding:3px 9px;font-size:11.5px;color:#C4B5FD;font-weight:600;margin:2px 3px 2px 0;}

/* ── Skill pill ── */
.skill{display:inline-block;background:rgba(37,99,235,.2);border:1px solid rgba(37,99,235,.4);border-radius:5px;padding:3px 10px;font-family:monospace;font-size:12.5px;color:#93C5FD;font-weight:700;margin:2px;}

/* ── Flow ── */
.flow{display:flex;align-items:center;gap:0;overflow-x:auto;}
.fnode{flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px 14px;text-align:center;min-width:110px;}
.farr{flex-shrink:0;color:rgba(255,255,255,.25);padding:0 6px;}

/* ── Table ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl thead th{background:rgba(255,255,255,.07);color:rgba(255,255,255,.4);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:8px 13px;text-align:left;}
.tbl td{padding:9px 13px;color:rgba(255,255,255,.68);border-bottom:1px solid rgba(255,255,255,.06);}
.tbl tr:last-child td{border-bottom:none;}
.tbl .done{color:#6EE7B7;font-weight:600;}
.tbl .wip{color:#FCD34D;}
.tbl .warn{color:#FCA5A5;}

/* ── Big message ── */
.bigmsg{background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(37,99,235,.15));border:1.5px solid rgba(124,58,237,.38);border-radius:12px;padding:22px 28px;text-align:center;margin-top:14px;}
.bmlbl{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;}
.bmtxt{font-size:18px;font-weight:800;color:#fff;line-height:1.6;}
.bmtxt .hl{color:#A78BFA;}

/* ── Time badge ── */
.tbadge{display:inline-block;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.3);border-radius:99px;padding:3px 11px;font-size:11px;font-weight:700;color:#C4B5FD;margin-right:6px;}

/* cover pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;}
.pill{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(124,58,237,.14);color:#C4B5FD;border:1px solid rgba(124,58,237,.32);}

/* v4 자연스러운 문장/간격 보정 */
.slide{overflow-y:auto}
.paper{max-height:calc(100vh - 128px);overflow-y:auto}
.h1,.h2,.h3{word-break:keep-all}
.sub,.cbody,.small,.step span,.st,.cb,.callout,.cl{word-break:keep-all}
.cbody,.cb{line-height:1.66}
.step{align-items:flex-start}
.grid3 .card{min-height:0}
.table td,.tbl td{word-break:keep-all}
@media(max-height:760px){
  .paper{padding:34px 42px}
  .h1{font-size:42px}
  .h2{font-size:30px}
  .sub{font-size:18px;margin-top:12px}
  .card{padding:20px}
  .callout{font-size:16px;padding:16px 20px}
}


/* ── 복붙 프롬프트 블록 ── */
pre.prompt{background:rgba(8,12,20,.85);border:1px solid rgba(124,58,237,.3);border-left:3px solid #7C3AED;
  border-radius:9px;padding:18px 22px;margin-top:14px;
  font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:13px;line-height:1.72;
  color:rgba(255,255,255,.82);white-space:pre-wrap;overflow-x:auto;}
.promptwrap{position:relative;}
.promptwrap pre.prompt{padding-right:104px;}
.copybtn{position:absolute;top:22px;right:12px;z-index:3;
  font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.2px;
  color:#C4B5FD;background:rgba(124,58,237,.16);border:1px solid rgba(124,58,237,.45);
  border-radius:7px;padding:5px 11px;cursor:pointer;transition:all .15s;}
.copybtn:hover{background:rgba(124,58,237,.34);color:#fff;}
.copybtn.done{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.55);color:#6EE7B7;}
.term{margin-top:14px;display:flex;align-items:flex-start;gap:10px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);
  border-radius:9px;padding:9px 13px;}
.term .tt{flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;color:#C4B5FD;
  background:rgba(124,58,237,.22);border-radius:5px;padding:3px 7px;margin-top:1px;}
.term .tb{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.62);}
.term .tb b{color:#fff;font-weight:700;}
.divslide{background:linear-gradient(135deg,rgba(124,58,237,.26) 0%,rgba(37,99,235,.10) 55%,rgba(124,58,237,.05) 100%);
  border:1px solid rgba(139,92,246,.42);border-radius:18px;padding:46px 50px;
  box-shadow:0 0 70px rgba(124,58,237,.14) inset;}
.divslide .kicker{color:#DDD6FE;}
.divslide .h2{color:#fff;}
.ba{grid-template-columns:1fr 1fr;}
.flow{justify-content:center;}
.inner{max-width:900px;}
.tbl td strong{color:#fff;}
.cl strong{color:#fff;}

html,body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;}

/* ── 2026 visual refresh: 업무 구조를 읽는 편집형 덱 ── */
:root{
  --ink:#101211;
  --paper:#F3F0E8;
  --paper-2:#E6E1D6;
  --coral:#FF6B4A;
  --coral-deep:#D94D31;
  --mint:#B8E7D0;
  --line:rgba(243,240,232,.16);
  --muted:rgba(243,240,232,.62);
}
html,body{background:var(--ink);color:var(--paper);}
body{background:
  radial-gradient(circle at 78% 8%, rgba(255,107,74,.12), transparent 28%),
  radial-gradient(circle at 8% 90%, rgba(184,231,208,.06), transparent 22%),
  var(--ink);}
.topbar{height:54px;background:rgba(16,18,17,.92);border-bottom:1px solid var(--line);padding:0 28px;gap:14px;backdrop-filter:blur(12px);}
.tb-badge{background:var(--coral);color:var(--ink);border-radius:5px;padding:5px 9px;font-size:10px;letter-spacing:.1em;}
.tb-title{font-size:13px;color:var(--paper);letter-spacing:-.02em;}
.tb-meta{color:rgba(243,240,232,.42);}
.tb-btn{border-color:var(--line);border-radius:4px;color:var(--muted);}
.tb-btn.on,.tb-btn:hover{background:rgba(255,107,74,.14);border-color:var(--coral);color:var(--paper);}
.progress{height:4px;background:rgba(243,240,232,.08);}
.pfill{background:var(--coral);}
.slide{padding:34px 72px;}
.inner{max-width:1020px;}
.kicker{color:var(--coral);font-size:10px;letter-spacing:.18em;margin-bottom:12px;}
.h1,.h2{color:var(--paper);letter-spacing:-.045em;}
.h1{font-size:clamp(42px,5.2vw,72px);line-height:.98;}
.h2{font-size:clamp(27px,3.1vw,43px);line-height:1.08;margin-bottom:10px;}
.sub{color:rgba(243,240,232,.52);font-size:14px;line-height:1.7;max-width:640px;}
.g2,.g3{gap:14px;}
.card,.bef,.aft,.demo,.step,.agbox,.pstep,.fnode{border-radius:4px;box-shadow:none;}
.card{background:rgba(243,240,232,.04)!important;border:1px solid var(--line)!important;padding:18px 19px;}
.card.pu,.card.bl,.card.gr,.card.am{border-top:3px solid var(--coral)!important;}
.card.rd{border-top:3px solid #F2A188!important;}
.ctag,.balbl,.bmlbl,.dlbl{color:var(--coral)!important;letter-spacing:.14em;}
.ct,.batask{color:var(--paper);font-size:16px;letter-spacing:-.02em;}
.cb,.babody{color:rgba(243,240,232,.63);line-height:1.7;}
.cl{border-radius:0;background:rgba(243,240,232,.05)!important;border-left:3px solid var(--coral)!important;color:var(--paper)!important;}
.bigmsg{background:var(--paper);border:0;border-radius:4px;padding:23px 28px;text-align:left;box-shadow:10px 10px 0 rgba(255,107,74,.22);}
.bmtxt{color:var(--ink);font-size:21px;line-height:1.4;letter-spacing:-.04em;}
.bmtxt .hl{color:var(--coral-deep);}
.bmlbl{color:rgba(16,18,17,.46)!important;}
.step{background:rgba(243,240,232,.04);border:0;border-left:1px solid var(--line);padding:13px 16px;}
.sn{border-radius:4px;background:var(--coral);color:var(--ink);}
.st{color:rgba(243,240,232,.74);}
.st strong{color:var(--paper);}
.pill,.rtag,.skill,.tbadge{background:rgba(255,107,74,.13);border-color:rgba(255,107,74,.36);color:#FFB09D;}
.flow{justify-content:flex-start;}
.fnode{background:rgba(243,240,232,.06);border-color:var(--line);}
.tbl thead th{background:rgba(243,240,232,.08);color:rgba(243,240,232,.52);}
.tbl td{color:rgba(243,240,232,.72);border-bottom-color:rgba(243,240,232,.1);}
.tbl .done{color:var(--mint);}
.tbl .warn{color:#FFB09D;}
.divslide{background:var(--paper);border:0;border-radius:4px;box-shadow:12px 12px 0 rgba(255,107,74,.22);}
.divslide .h2,.divslide .sub{color:var(--ink);}
.divslide .kicker{color:var(--coral-deep);}
.divslide .agbox{background:var(--ink);border-color:var(--ink);}
.divslide .agbox div{color:var(--paper)!important;}
.paper{max-height:calc(100vh - 140px);}
.cover-inner{align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:20px 0 10px;}
.cover-title{font-size:clamp(60px,8.8vw,132px);line-height:.9;letter-spacing:-.075em;margin-top:18px;max-width:900px;}
.cover-copy{margin-top:34px;color:rgba(243,240,232,.72);font-size:20px;line-height:1.45;letter-spacing:-.035em;}
.cover-footer{display:grid;grid-template-columns:150px 1fr auto;gap:18px;align-items:center;margin-top:76px;padding-top:17px;border-top:1px solid var(--line);font-size:12px;color:rgba(243,240,232,.48);}
.cover-footer strong{color:var(--paper);font-size:14px;font-weight:600;letter-spacing:-.02em;}
.cover-credit{justify-self:end;color:rgba(243,240,232,.44);}
.stage:before{content:"↗";position:absolute;right:7.5%;top:10%;font-size:112px;line-height:1;color:rgba(255,107,74,.74);font-weight:300;z-index:0;pointer-events:none;}
.slide>*{position:relative;z-index:1;}

/* 구조화 트리: 모노스페이스 텍스트를 실제 노드로 보이게 */
.demo .mono{color:var(--paper);}
.demo [style*="rgba(110,231,183"]{color:var(--mint)!important;}
.demo [style*="#C4B5FD"]{color:var(--coral)!important;}
.demo [style*="rgba(124,58,237"]{color:var(--coral)!important;}
.demo>div[style*="background:rgba(0,0,0"]{position:relative;border-left:1px solid rgba(255,107,74,.5);padding-left:22px!important;}
.demo>div[style*="background:rgba(0,0,0"]:before{content:"";position:absolute;left:-1px;top:15px;bottom:15px;border-left:1px dashed rgba(243,240,232,.22);}

/* 첨부 픽셀 캐릭터: Agent가 일하는 모습을 보여주는 고정 가이드 */
.claude-guide{display:none;position:fixed;right:26px;bottom:22px;z-index:8;width:128px;pointer-events:none;opacity:.96;filter:drop-shadow(0 10px 14px rgba(0,0,0,.28));text-align:center;}
.character-on .claude-guide{display:block;}
.claude-guide img{display:block;width:128px;height:auto;image-rendering:pixelated;}
.claude-guide .caption{display:block;margin-top:2px;white-space:nowrap;color:rgba(243,240,232,.48);font-size:10px;letter-spacing:.08em;}
@media(max-width:900px){.slide{padding:28px 44px}.claude-guide{right:10px;bottom:12px;width:92px}.claude-guide img{width:92px}.tb-meta{display:none}}
@media(max-width:700px){.cover-title{font-size:62px}.cover-copy{font-size:17px}.cover-footer{grid-template-columns:1fr;gap:8px;margin-top:48px}.cover-credit{justify-self:start}}
@media(max-width:800px){.topbar{padding:0 10px;gap:8px}.tb-badge{font-size:9px;padding:4px 6px}.tb-title{font-size:11px;line-height:1.05;max-width:72px}.tb-right{gap:5px}.dots{display:none}.counter{font-size:10px}.tb-btn{padding:4px 6px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.panelshot{display:inline-block;position:relative;margin-top:10px;border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;background:#fff;line-height:0;}
.panelshot img{display:block;max-height:530px;max-width:100%;width:auto;height:auto;}
.bdg{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;
  box-shadow:0 0 0 3px rgba(13,17,23,.55);}
.bdg.on{background:#7C3AED;color:#fff;}
.bdg.off{background:#94A3B8;color:#0D1117;}
.bdg.alt{background:#F59E0B;color:#0D1117;}

/* ── 실습 미리보기 애니메이션 ── */
.demo{background:#0B0F16;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:14px 16px;font-size:12.5px;color:rgba(255,255,255,.75);}
.demo .dlbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#A78BFA;margin-bottom:10px;}
.demo .mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace;}
.fline{opacity:0;transform:translateY(-6px);display:flex;align-items:center;gap:7px;padding:4px 0;}
.slide.active .fline{animation:fin .45s ease forwards;}
@keyframes fin{to{opacity:1;transform:translateY(0);}}
.fline i{width:13px;height:13px;border-radius:3px;background:#475569;flex:none;font-style:normal;}
.fline.fo i{background:#7C3AED;}
.fline.fn i{background:#10B981;}
.bubble{background:rgba(124,58,237,.16);border:1px solid rgba(124,58,237,.34);border-radius:9px;padding:9px 12px;margin-bottom:8px;opacity:0;}
.slide.active .bubble{animation:fin .5s ease forwards;}
.card-pop{opacity:0;transform:scale(.9);}
.slide.active .card-pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1) forwards;}
@keyframes pop{to{opacity:1;transform:scale(1);}}
.typing{display:inline-block;overflow:hidden;white-space:nowrap;width:0;vertical-align:bottom;}
.slide.active .typing{animation:tw 1.6s steps(34,end) forwards;}
@keyframes tw{to{width:100%;}}
.slotrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.slotrow b{color:rgba(255,255,255,.5);font-size:11.5px;}
.slotval{position:relative;height:15px;}
.slotval .ph{position:absolute;inset:0;color:rgba(255,255,255,.28);}
.slotval .rv{position:absolute;inset:0;opacity:0;color:#6EE7B7;}
.slide.active .slotval .ph{animation:fout .3s ease forwards;}
.slide.active .slotval .rv{animation:fin .4s ease forwards;}
@keyframes fout{to{opacity:0;}}
.slotrow.ask .slotval .rv{color:#FCD34D;}
.agbox{border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:11px 13px;background:rgba(255,255,255,.03);transition:none;}
.slide.active .agbox.a1{animation:glow 1.1s ease .2s forwards;}
.slide.active .agbox.a2{animation:glow 1.1s ease 2.0s forwards;}
@keyframes glow{0%{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.03);}
  45%{border-color:#7C3AED;background:rgba(124,58,237,.2);box-shadow:0 0 0 3px rgba(124,58,237,.14);}
  100%{border-color:rgba(124,58,237,.45);background:rgba(124,58,237,.1);box-shadow:none;}}
.deskwrap{display:flex;gap:26px;justify-content:center;align-items:flex-end;padding:18px 0 6px;}
.desk{text-align:center;}
.guy{width:38px;height:44px;margin:0 auto 5px;border-radius:9px 9px 4px 4px;position:relative;}
.guy:after{content:"";position:absolute;left:9px;top:8px;width:20px;height:9px;border-radius:3px;background:rgba(0,0,0,.35);}
.slide.active .guy.g1{animation:tap .5s ease-in-out .3s infinite;}
.slide.active .guy.g2{animation:tap .5s ease-in-out 2.2s infinite;}
@keyframes tap{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.deskplate{width:66px;height:7px;border-radius:3px;background:#334155;margin:0 auto;}
.say{position:relative;margin:0 auto 6px;width:max-content;background:#fff;color:#0D1117;font-size:10.5px;font-weight:800;
  padding:4px 9px;border-radius:9px;opacity:0;}
.slide.active .say{animation:fin .4s ease 3.4s forwards;}

/* 도입부 전용 구조 시각화 스타일 */
.route,.workflow{display:flex;align-items:stretch;gap:12px}.route-node,.wfbox{flex:1;min-width:0;overflow:hidden;padding:20px;background:rgba(243,240,232,.05);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:8px}.route-node.hot,.wfbox.accent{border-color:var(--coral);background:rgba(255,107,74,.10)}.route-node span,.wfbox span{font-size:10px;color:var(--coral);font-weight:800;letter-spacing:.12em}.route-node strong,.wfbox strong{font-size:16px;color:var(--paper);word-break:keep-all}.route-node small,.wfbox small{font-size:12px;color:var(--muted);line-height:1.5;word-break:keep-all}.route-node b,.wfbox small{font-family:monospace}.route-arrow,.wfarr{display:flex;align-items:center;color:var(--coral);font-size:22px;flex:none}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compare-col{padding:22px;border:1px solid var(--line);border-radius:4px;background:rgba(243,240,232,.04)}.compare-col.hot{border-color:var(--coral);background:rgba(255,107,74,.08)}.tree-root{font-size:18px;font-weight:800;color:var(--paper);margin:22px 0 9px}.tree-line{font:14px/1.9 monospace;color:var(--mint);padding-left:6px}@media(max-width:800px){.route,.workflow{flex-direction:column}.route-arrow,.wfarr{justify-content:center;transform:rotate(90deg)}.compare{grid-template-columns:1fr}}

/* ── 오늘 파이프라인 ── */
.pipe{display:flex;align-items:stretch;justify-content:center;gap:0;margin-top:16px;}
.pstep{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:13px 11px;text-align:center;}
.pstep.hot{background:rgba(124,58,237,.14);border-color:rgba(124,58,237,.45);}
.pn{font-size:10px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-bottom:6px;}
.pstep.hot .pn{color:#C4B5FD;}
.pt{font-size:14px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:6px;}
.pf{font-family:"SFMono-Regular",Menlo,monospace;font-size:10.5px;color:#6EE7B7;line-height:1.5;min-height:30px;}
.pppl{display:flex;gap:5px;justify-content:center;margin:9px 0 5px;height:26px;align-items:flex-end;}
.pppl span{width:15px;height:20px;border-radius:5px 5px 2px 2px;display:block;}
.pppl .p1{background:#60A5FA;}
.pppl .p2{background:#C4B5FD;}
.pppl .ghost{width:15px;height:20px;border:1px dashed rgba(255,255,255,.25);background:none;color:rgba(255,255,255,.3);
  font-size:11px;line-height:20px;text-align:center;border-radius:5px;}
.pcap{font-size:10.5px;color:rgba(255,255,255,.45);}
.pstep.hot .pcap{color:#C4B5FD;font-weight:700;}
.parr{display:flex;align-items:center;color:rgba(255,255,255,.25);font-size:15px;padding:0 5px;flex:none;}
</style>
</head>
<body>

<div class="topbar">
  <span class="tb-badge">입문 60분</span>
  <span class="tb-title">Single → Multi Agent</span>
  <span class="tb-meta">· 60분 · 이유진</span>
  <div class="tb-right">
    <div class="dots" id="dots"></div>
    <span class="counter"><span id="cur">1</span> / <span id="tot">0</span></span>
    <button class="tb-btn" id="noteBtn" onclick="toggleNotes()">발표 노트</button>
  </div>
</div>
<div class="progress"><div class="pfill" id="pf"></div></div>

<div class="stage" id="stage"></div>
<div class="claude-guide" aria-label="Agent 역할 안내 캐릭터">
  <img src="agent-character.png" alt="픽셀 스타일 Agent 캐릭터" />
  <span class="caption">질문 · 실행 · 확인</span>
</div>
<button class="arr p" id="btnP" onclick="go(-1)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3l-5 5 5 5"/></svg></button>
<button class="arr n" id="btnN" onclick="go(1)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg></button>

<div class="notes" id="notesPanel">
  <div class="nlbl">발표 노트</div>
  <div id="notesText"></div>
</div>

<script>
const SLIDES = [
{notes:"표지. 한 문장만 말한다 — 오늘은 Agent 하나에서 둘로 갑니다. 설명은 다음 장부터. 10초 안에 넘긴다.",html:"<div class=\"inner\" style=\"text-align:center;\">\n  <div class=\"kicker\" style=\"letter-spacing:2px;\">60분 실습 특강</div>\n  <div class=\"h1\" style=\"letter-spacing:-1.5px;line-height:1.1;margin-top:6px;\">Single <span style=\"color:#7C3AED;\">&rarr;</span> Multi Agent</div>\n  <div style=\"font-size:19px;color:rgba(255,255,255,.6);margin-top:20px;font-weight:500;\">AI 하나가 만들고, 다른 AI가 검사합니다</div>\n  <div style=\"display:flex;justify-content:center;align-items:center;gap:16px;margin-top:38px;\">\n    <div class=\"agbox\" style=\"animation-delay:.2s;min-width:150px;text-align:center;padding:14px 18px;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.4);\">AI &#9312;</div>\n      <div style=\"font-weight:800;font-size:15px;color:#fff;margin-top:3px;\">초안을 만든다</div>\n    </div>\n    <div style=\"font-size:24px;color:#7C3AED;font-weight:800;\">+</div>\n    <div class=\"agbox\" style=\"animation-delay:.6s;min-width:150px;text-align:center;padding:14px 18px;border-color:#7C3AED;background:rgba(124,58,237,.14);\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.4);\">AI &#9313;</div>\n      <div style=\"font-weight:800;font-size:15px;color:#fff;margin-top:3px;\">그걸 검사한다</div>\n    </div>\n  </div>\n  <div style=\"margin-top:40px;font-size:12.5px;color:rgba(255,255,255,.3);\">이유진 · AX 컨설턴트 / B2B AI 강사</div>\n</div>"},
{notes:"지난주 background는 재료다. 오늘은 Single Agent를 만들고 Multi Agent까지 간다. 시각화(픽셀)는 깃허브로 따로 보여준다고 말한다.",html:"<div class=\"inner\" style=\"max-width:1050px;\">\n  <div class=\"kicker\">오늘 흐름</div>\n  <div class=\"h2\" style=\"font-size:25px;\">오늘 여기까지 갑니다</div>\n  <div class=\"pipe\" style=\"margin-top:26px;\">\n    <div class=\"pstep\"><div class=\"pn\">지난주</div><div class=\"pt\">background</div><div class=\"pf\">background.md</div><div class=\"pppl\"><span class=\"ghost\">?</span></div><div class=\"pcap\">이미 하신 것</div></div>\n    <div class=\"parr\">→</div>\n    <div class=\"pstep hot\"><div class=\"pn\">실습 1</div><div class=\"pt\">Single Agent</div><div class=\"pf\">SKILL.md → draft.md</div><div class=\"pppl\"><span class=\"p1\"></span></div><div class=\"pcap\">Agent 1</div></div>\n    <div class=\"parr\">→</div>\n    <div class=\"pstep hot\"><div class=\"pn\">실습 2</div><div class=\"pt\">Multi Agent</div><div class=\"pf\">방 2개 → review.md</div><div class=\"pppl\"><span class=\"p1\"></span><span class=\"p2\"></span></div><div class=\"pcap\">Agent 2</div></div>\n  </div>\n</div>"},
{notes:"Ground Rule 세 가지. 각 줄 굵은 글씨만 읽고 넘어간다. 30초.",html:"<div class=\"inner\" style=\"max-width:940px;\">\n  <div class=\"kicker\">Ground Rule</div>\n  <div class=\"h2\" style=\"font-size:25px;\">세 가지</div>\n  <div style=\"margin-top:22px;\">\n    <div class=\"step\"><div class=\"sn\">1</div><div class=\"st\"><strong>모르는 단어 → 바로 손</strong><br/><span style=\"color:rgba(255,255,255,.5);\">제 설명이 빨랐던 겁니다</span></div></div>\n    <div class=\"step\"><div class=\"sn\">2</div><div class=\"st\"><strong>외우지 않기</strong><br/><span style=\"color:rgba(255,255,255,.5);\">화면 글을 복사해서 붙이면 됩니다</span></div></div>\n    <div class=\"step\"><div class=\"sn\">3</div><div class=\"st\"><strong>잘 만들려 하지 않기</strong><br/><span style=\"color:rgba(255,255,255,.5);\">한 번 돌아가는 걸 보는 날입니다</span></div></div>\n  </div>\n</div>"},
{notes:"비유를 팀으로 확장한다. 신입 한 명 세우는 것까지가 절반이고, 짝을 붙이는 게 오늘의 나머지 절반이다. 마지막 줄에서 왜 한 명으로는 안 되는지 반드시 짚는다.",html:"<div class=\"inner\" style=\"max-width:1100px;\">\n  <div class=\"kicker\">개념 · Agent</div>\n  <div class=\"h2\" style=\"font-size:25px;\">AI = 매일 기억을 잃는 신입</div>\n  <div class=\"g3\" style=\"margin-top:14px;\">\n    <div class=\"card rd\"><div class=\"ctag rd\">지금까지</div><div class=\"ct\">매일 처음부터 다시</div><div class=\"cb\">어제 알려준 걸 오늘 또 알려줍니다. 방도 없고 안내문도 없으니 매번 새로 설명해야 합니다.</div></div>\n    <div class=\"card bl\"><div class=\"ctag bl\">오늘 앞부분</div><div class=\"ct\">첫 agent을 앉힙니다</div><div class=\"cb\">방을 주고, 업무 안내문을 써주고, 일하는 순서를 쥐여줍니다. 이제 설명 없이도 일합니다.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">오늘 뒷부분</div><div class=\"ct\">짝을 붙입니다</div><div class=\"cb\">그런데 혼자면 자기가 만든 걸 자기가 봅니다. <strong>검사하는 사람을 한 명 더</strong> 앉힙니다.</div></div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">왜 한 명으로는 안 되냐면</div><div class=\"bmtxt\">만드는 사람과 의심하는 사람이 <span class=\"hl\">한 머리에 있으면 반드시 섞입니다.</span><br/>그래서 오늘 둘로 나눕니다.</div></div>\n</div>"},
{notes:"왼쪽 오른쪽을 번갈아 짚는다. Skill 개수는 넷으로 같다. 다른 건 방이 하나냐 둘이냐뿐. 왼쪽은 이력서 쓰던 논리로 면접 답변까지 만들고, 오른쪽 면접 방은 완성된 이력서만 받아서 진짜 면접관처럼 본다.",html:"<div class=\"inner\" style=\"max-width:1150px;\">\n  <div class=\"kicker\">예시 · 취업 준비를 맡긴다면</div>\n  <div class=\"h2\" style=\"font-size:25px;\">Single Agent vs Multi Agent</div>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;\">\n    <div class=\"demo\" style=\"padding:16px 20px;\">\n      <div style=\"font-size:13px;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:.5px;margin-bottom:10px;\">SINGLE AGENT</div>\n      <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:12px 14px;min-height:168px;\"><div class=\"fline\" style=\"animation-delay:0.2s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:#fff;font-weight:800;\">취준 Agent</span></div><div class=\"fline\" style=\"animation-delay:0.35s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:rgba(110,231,183,.8);font-weight:600;\">├── JD 분석 Skill</span></div><div class=\"fline\" style=\"animation-delay:0.45s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:rgba(110,231,183,.8);font-weight:600;\">├── 이력서 맞춤 Skill</span></div><div class=\"fline\" style=\"animation-delay:0.55s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:rgba(110,231,183,.8);font-weight:600;\">├── 예상질문 Skill</span></div><div class=\"fline\" style=\"animation-delay:0.65s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:rgba(110,231,183,.8);font-weight:600;\">└── 답변 다듬기 Skill</span></div></div>\n      <div class=\"cl rd\" style=\"margin:12px 0 0;font-size:12.5px;\">방 하나에서 다 합니다. <strong>판단이 섞입니다.</strong></div>\n    </div>\n    <div class=\"demo\" style=\"padding:16px 20px;border-color:rgba(124,58,237,.45);\">\n      <div style=\"font-size:13px;font-weight:800;color:#C4B5FD;letter-spacing:.5px;margin-bottom:10px;\">MULTI AGENT</div>\n      <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:12px 14px;min-height:168px;\"><div class=\"fline\" style=\"animation-delay:0.5s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:#fff;font-weight:800;\">취준 Agent</span></div><div class=\"fline\" style=\"animation-delay:0.65s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:#C4B5FD;font-weight:800;\">├── 이력서 agent</span></div><div class=\"fline\" style=\"animation-delay:0.75s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:rgba(110,231,183,.8);font-weight:600;\">│   ├── JD 분석 Skill</span></div><div class=\"fline\" style=\"animation-delay:0.85s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:rgba(110,231,183,.8);font-weight:600;\">│   └── 이력서 맞춤 Skill</span></div><div class=\"fline\" style=\"animation-delay:0.95s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:#C4B5FD;font-weight:800;\">└── 면접 agent</span></div><div class=\"fline\" style=\"animation-delay:1.05s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:rgba(110,231,183,.8);font-weight:600;\">    ├── 예상질문 Skill</span></div><div class=\"fline\" style=\"animation-delay:1.15s;padding:2.5px 0;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;color:rgba(110,231,183,.8);font-weight:600;\">    └── 답변 다듬기 Skill</span></div></div>\n      <div class=\"cl gr\" style=\"margin:12px 0 0;font-size:12.5px;\">담당마다 방이 따로. <strong>면접 방은 결과물만 봅니다.</strong></div>\n    </div>\n  </div>\n  <div class=\"term\"><span class=\"tt\">용어</span><span class=\"tb\"><b>agent</b> = 담당(방) &nbsp;·&nbsp; <b>skill</b> = 그 담당이 일하는 방법</span></div>\n</div>"},
{notes:"굳이 나눠야 하냐는 질문에 대한 답. 일이 하나면 안 나눠도 된다고 먼저 인정해주는 게 중요하다. 그래야 나머지를 믿는다. (말로: 오늘은 이 중에서 제일 작은 걸 만듭니다. 방 두 개, Skill 하나.)",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">왜 나누나</div>\n  <div class=\"h2\" style=\"font-size:25px;\">섞이면 안 되는 판단이 둘 이상일 때</div>\n  <div class=\"g3\" style=\"margin-top:18px;\">\n    <div class=\"card rd\"><div class=\"ctag rd\">한 방에 다 시키면</div><div class=\"cb\">JD 보다가 이력서 고치고 면접 질문까지 한 창에서 섞입니다. <strong>앞에서 정한 걸 뒤에서 잊습니다.</strong></div></div>\n    <div class=\"card gr\"><div class=\"ctag gr\">나누면</div><div class=\"cb\">면접 방은 <strong>완성된 이력서만</strong> 받습니다. 왜 그렇게 썼는지는 모릅니다. 그래서 진짜 면접관처럼 봅니다.</div></div>\n    <div class=\"card am\"><div class=\"ctag am\">나누는 기준 한 줄</div><div class=\"cb\"><strong>섞이면 안 되는 판단이 두 개 이상일 때</strong>만 나눕니다. 하나면 그냥 한 방에서 하세요.</div></div>\n  </div>\n  \n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 새로 쓰지 않습니다. 그때 대화한 창에서 끄집어냅니다.",html:"<div class=\"inner divslide\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">01</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">준비 ① · 5–9분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">지난주 이야기를 파일 한 장으로</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">새로 쓰지 않습니다. 그때 대화한 창에서 끄집어냅니다.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 0</div>\n    </div>\n  </div>\n</div>"},
{notes:"메시지 하나 — 새로 안 쓰고 지난주 창에서 긁어온다. 지금 그 창을 찾아 열게 하고 손 들게 한다. 못 찾은 분은 새 대화 열고 다음 장 항목을 직접 적어달라고 하면 된다(말로만).",html:"<div class=\"inner\" style=\"max-width:1000px;\">\n  <div class=\"kicker\">준비 ① 재료 찾기</div>\n  <div class=\"h2\" style=\"font-size:25px;\">지난주 대화창을 엽니다</div>\n  <div class=\"demo\" style=\"margin-top:22px;padding:20px 24px;\">\n    <div class=\"dlbl\">그 창에 이런 게 남아 있습니다</div>\n    <div class=\"bubble mono\" style=\"animation-delay:.4s;font-size:12.5px;\">제 업무는 매주 회의록을 정리해서…</div>\n    <div class=\"bubble mono\" style=\"animation-delay:.9s;font-size:12.5px;\">그때 제일 신경 쓰는 건 결정된 것만…</div>\n    <div class=\"bubble mono\" style=\"animation-delay:1.4s;font-size:12.5px;margin-bottom:0;\">담당자가 없으면 임의로 안 만들고…</div>\n  </div>\n  <div class=\"cl am\">새로 쓰지 않습니다. <strong>이걸 긁어옵니다.</strong></div>\n</div>"},
{notes:"복붙 프롬프트. 지난주 창에 그대로 붙여넣게 한다. 대괄호도 없어서 고칠 게 없다. 비워두라는 지시가 들어 있으니, 빈칸이 나와도 정상이라고 미리 말해준다. [용어 짚기: 프롬프트] 한 문장만 읽고 바로 넘어간다. (말로: 고칠 데 없습니다. 통째로 복사해서 붙이고 엔터만 치면 됩니다.)",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">준비 ① 프롬프트 <span style=\"font-weight:600;color:rgba(167,139,250,.9);\">(프롬프트)</span></div>\n  <div class=\"h2\" style=\"font-size:25px;\">이 글을 그대로 붙여넣기</div>\n  <pre class=\"prompt\">이 대화창에서 내가 한 이야기를 전부 긁어모아 md 파일 한 장으로 정리해줘.\n이 파일은 내 업무 Agent를 만들기 전에, 그 Agent가 읽을 배경 자료로 쓸 거야.\n\n아래 순서로 적어줘.\n1. 내가 풀려는 문제 한 문장\n2. 내 직무와 하는 일\n3. 이 업무의 진행 순서 (내가 말했던 그대로)\n4. 내가 중요하다고 말한 판단 기준\n5. 하면 안 된다고 말한 것\n6. 사람이 확인해야 한다고 말한 지점\n7. 결과물이 어떤 모양이어야 한다고 말한 것\n8. 고치고 싶다고 말한 것\n\n내가 말한 것만 적어. 비어 있는 항목은 비어 둔 채로 두고 추측해서 채우지 마.\n파일 이름은 background.md 로 해줘.</pre>\n  \n\n  <div class=\"term\"><span class=\"tt\">용어</span><span class=\"tb\">이렇게 <b>AI에게 시키는 글 한 덩어리</b>를 프롬프트라고 합니다. 외우는 게 아니라 복사해서 붙이는 겁니다.</span></div>\n</div>"},
{notes:"이 문서에 뭐가 들어 있는지 보여주는 장표. 여덟 줄을 다 읽지 말고 4번과 6번 노란 줄만 짚는다. 빈칸이 있는 게 정상이고, 그 빈칸을 다음 단계에서 AI가 하나씩 물어본다고 말하고 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1020px;\">\n  <div class=\"kicker\">준비 ① 산출물</div>\n  <div class=\"h2\" style=\"font-size:25px;\">background.md — 여덟 항목</div>\n  <div class=\"demo\" style=\"margin-top:18px;padding:18px 22px;\">\n    <div style=\"background:rgba(0,0,0,.24);border-radius:9px;padding:14px 18px;\"><div class=\"fline\" style=\"animation-delay:0.25s;display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:3.5px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.3);\">1</span><span style=\"font-size:13.5px;color:#fff;font-weight:700;\">문제정의</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">회의록을 팀 공유용으로 정리하는 데 시간이 오래 걸린다</span></div><div class=\"fline\" style=\"animation-delay:0.33999999999999997s;display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:3.5px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.3);\">2</span><span style=\"font-size:13.5px;color:#fff;font-weight:700;\">하는 일</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">기획팀 · 주간회의 담당</span></div><div class=\"fline\" style=\"animation-delay:0.43s;display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:3.5px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.3);\">3</span><span style=\"font-size:13.5px;color:#fff;font-weight:700;\">순서</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">원문 읽기 → 결정된 것만 추리기 → 담당자 → 기한</span></div><div class=\"fline\" style=\"animation-delay:0.52s;display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:3.5px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.3);\">4</span><span style=\"font-size:13.5px;color:#fff;font-weight:700;\">판단 기준</span><span style=\"font-size:12.5px;color:rgba(252,211,77,.9);\">(비어 있음)</span></div><div class=\"fline\" style=\"animation-delay:0.61s;display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:3.5px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.3);\">5</span><span style=\"font-size:13.5px;color:#fff;font-weight:700;\">금지</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">원문에 없는 내용 쓰지 않기</span></div><div class=\"fline\" style=\"animation-delay:0.7s;display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:3.5px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.3);\">6</span><span style=\"font-size:13.5px;color:#fff;font-weight:700;\">확인 지점</span><span style=\"font-size:12.5px;color:rgba(252,211,77,.9);\">(비어 있음)</span></div><div class=\"fline\" style=\"animation-delay:0.79s;display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:3.5px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.3);\">7</span><span style=\"font-size:13.5px;color:#fff;font-weight:700;\">결과물</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">제목 / 결정사항 / 다음 할 일</span></div><div class=\"fline\" style=\"animation-delay:0.88s;display:grid;grid-template-columns:22px 130px 1fr;gap:10px;padding:3.5px 0;align-items:baseline;\"><span class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.3);\">8</span><span style=\"font-size:13.5px;color:#fff;font-weight:700;\">개선점</span><span style=\"font-size:12.5px;color:rgba(255,255,255,.62);\">매번 형식이 달라지는 것</span></div></div>\n  </div>\n  <div class=\"cl am\">노란 줄은 <strong>지난주에 말 안 한 항목</strong>입니다. 그냥 두고 갑니다.</div>\n</div>"},
{notes:"확인 세 단계만. 3번이 제일 중요하다 — 전부 복사, 창 닫지 마세요. 다음은 다른 방이라 이 대화가 안 따라간다. 여기서 손 들게 하고 다음으로 넘어간다. (말로: 다음은 다른 방에서 합니다. 그 방은 이 대화를 모릅니다.)",html:"<div class=\"inner\" style=\"max-width:900px;\">\n  <div class=\"kicker\">준비 ① 체크</div>\n  <div class=\"h2\" style=\"font-size:25px;\">복사해두고, 창은 열어둡니다</div>\n  <div style=\"margin-top:18px;\">\n    <div class=\"step\"><div class=\"sn\">1</div><div class=\"st\">나온 내용을 <strong>쭉 훑어보세요.</strong> 내가 한 말이 맞는지만 보면 됩니다.</div></div>\n    <div class=\"step\"><div class=\"sn\">2</div><div class=\"st\"><strong>비어 있는 항목은 그냥 두세요.</strong> 채우려고 붙잡지 마세요.</div></div>\n    <div class=\"step\"><div class=\"sn\">3</div><div class=\"st\">나온 내용을 <strong>전부 복사해두세요.</strong> 이 창은 닫지 마세요.</div></div>\n  </div>\n  \n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 방을 옮깁니다. 파일이 진짜로 만들어지는 방으로.",html:"<div class=\"inner divslide\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">02</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">준비 ② · 9–16분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">Agent가 일할 방을 만듭니다</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">방을 옮깁니다. 파일이 진짜로 만들어지는 방으로.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 0 → 1</div>\n    </div>\n  </div>\n</div>"},
{notes:"1단계 — 서랍부터 짠다. 붙여넣고 엔터만 치면 된다. 여기서 왼쪽 파일 목록에 폴더 네 개가 하나씩 생기는 걸 말 없이 보게 둔다. Finder도 같이 띄워놓고 '진짜 내 컴퓨터에 생겼다'를 한 번 보여주면 체감이 크다. 대괄호는 CLAUDE.md 쪽 네 줄뿐이다. [용어 짚기: CLAUDE.md] 한 문장만 읽고 바로 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1150px;\">\n  <div class=\"kicker\">준비 ② 프롬프트 1 <span style=\"font-weight:600;color:rgba(167,139,250,.9);\">(CLAUDE.md)</span></div>\n  <div class=\"h2\" style=\"font-size:25px;\">폴더 둘 + 규칙 파일 하나</div>\n  <div style=\"display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:start;margin-top:10px;\">\n    <div>\n      <pre class=\"prompt\" style=\"font-size:12.5px;\">내 업무용 작업 폴더를 정리하려고 해. 나는 [ 내 직무 / 하는 일 ]이야.\n\n1. 이 폴더 안에 두 칸을 만들어줘.\n   input    이번에 처리할 원본 자료\n   output   완성된 결과물\n\n2. CLAUDE.md 파일을 만들고 아래를 적어줘.\n   - 내가 풀려는 문제 한 줄 [ 지난주 쓴 문장, 없으면 지금 한 줄 ]\n   - 결과물 말투     [ 예: 입니다체, 짧은 문장, 과장 없이 ]\n   - 항상 지킬 형식   [ 예: 제목 / 핵심 3줄 / 다음 할 일 ]\n   - 절대 하면 안 될 것 [ 예: 확인 안 된 숫자 쓰기, 승인 없이 메일 보내기 ]\n\n3. 다 만들었으면 폴더 구조를 보여줘.</pre>\n    </div>\n    <div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">내 컴퓨터에 이렇게 생깁니다</div>\n      <div class=\"mono\" style=\"font-size:12.5px;line-height:2;\">\n        <div class=\"fline\" style=\"animation-delay:.3s;color:rgba(255,255,255,.75);font-weight:700;\"><i style=\"background:#334155\"></i>회의록작업/</div>\n        <div class=\"fline fn\" style=\"animation-delay:.9s;\">&nbsp;&nbsp;<i></i>CLAUDE.md</div>\n        <div class=\"fline fn\" style=\"animation-delay:1.3s;\">&nbsp;&nbsp;<i></i>input/</div>\n        <div class=\"fline fn\" style=\"animation-delay:1.7s;\">&nbsp;&nbsp;<i></i>output/</div>\n      </div>\n      <div class=\"bubble\" style=\"animation-delay:2.3s;margin-top:10px;margin-bottom:0;font-size:12px;\">Finder를 열어보세요. <strong>진짜로 생겨 있습니다.</strong></div>\n    </div>\n  </div>\n  <div class=\"term\"><span class=\"tt\">용어</span><span class=\"tb\"><b>CLAUDE.md</b> — 이 방의 모든 대화가 항상 먼저 읽는 규칙 파일입니다.</span></div>\n</div>"},
{notes:"2단계 — 이제 배경을 옮긴다. 이 방은 지난주 대화를 못 본다는 걸 다시 한 번 말하고, 구분선 사이에 붙여넣으라고 화면에서 손으로 짚어준다. background.md가 왼쪽 목록에 뜨면 성공. 여기까지가 준비 끝이다. [용어 짚기: 이전 프롬프트] 한 문장만 읽고 바로 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1150px;\">\n  <div class=\"kicker\">준비 ② 프롬프트 2 <span style=\"font-weight:600;color:rgba(167,139,250,.9);\">(이전 프롬프트)</span></div>\n  <div class=\"h2\" style=\"font-size:25px;\">배경을 새 방으로 옮기기</div>\n  <div class=\"cl am\" style=\"margin-top:8px;\">이 방은 <strong>지난주 대화를 못 봅니다.</strong> 그래서 복사해서 통째로 옮깁니다.</div>\n  <div style=\"display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:start;margin-top:8px;\">\n    <div>\n      <pre class=\"prompt\" style=\"font-size:12.5px;\">아래는 내가 다른 대화창에서 정리해 둔 내 업무 배경이야.\n이 방은 그 대화를 모르니까 그대로 옮겨왔어.\n\n--- 여기부터 배경 ---\n[ 아까 복사한 내용 전체를 여기에 붙여넣기 ]\n--- 여기까지 배경 ---\n\n1. 위 배경을 <b>background.md</b> 로 그대로 저장해줘.\n   내용은 고치지 마. 비어 있는 항목도 비운 채로 둬.\n\n2. 이 배경과 CLAUDE.md를 비교해서, 서로 어긋나는 게 있으면\n   고치지 말고 <b>어디가 다른지만</b> 알려줘.</pre>\n    </div>\n    <div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">이게 뜨면 준비 끝</div>\n      <div class=\"mono\" style=\"font-size:12px;line-height:1.95;\">\n        <div class=\"fline\" style=\"animation-delay:.3s;color:rgba(255,255,255,.4);\"><i style=\"background:#334155\"></i>회의록작업/</div>\n        <div class=\"fline\" style=\"animation-delay:.5s;color:rgba(255,255,255,.4);\">&nbsp;&nbsp;<i style=\"background:#334155\"></i>CLAUDE.md</div>\n        <div class=\"fline\" style=\"animation-delay:.7s;color:rgba(255,255,255,.4);\">&nbsp;&nbsp;<i style=\"background:#334155\"></i>background.md/</div>\n        <div class=\"fline fn\" style=\"animation-delay:1.3s;font-weight:700;\">&nbsp;&nbsp;&nbsp;&nbsp;<i></i>background.md</div>\n      </div>\n      <div class=\"bubble\" style=\"animation-delay:1.9s;margin-top:10px;margin-bottom:0;font-size:12px;\">대화창에 있던 게 <strong>파일이 됐습니다.</strong> 이제 다른 방에서도 읽힙니다.</div>\n    </div>\n  </div>\n  \n\n  <div class=\"term\"><span class=\"tt\">용어</span><span class=\"tb\"><b>방을 옮길 때 배경을 통째로 들고 가는 프롬프트</b>입니다. 방이 바뀌면 대화는 안 따라가니까요.</span></div>\n</div>"},
{notes:"두 번째 확인이 이 블록의 진짜 목표다. 파일을 열어서 지난주 문장을 손으로 가리키게 한다. 먼저 끝난 사람에게는 금지선 한 줄 더 쓰게 시킨다. (말로: 먼저 끝나셨으면 CLAUDE.md에 하면 안 되는 것 한 줄 더 써보세요.)",html:"<div class=\"inner\">\n  <div class=\"kicker\">준비 ② 체크</div>\n  <div class=\"h2\">파일 목록에 뜨면 성공</div>\n  <div class=\"g2\" style=\"margin-top:16px;\">\n    <div class=\"card gr\"><div class=\"ctag gr\">01</div><div class=\"ct\">왼쪽에 보이나요</div><div class=\"cb\">앱 왼쪽 파일 목록에 <strong>폴더 네 개와 CLAUDE.md</strong>가 실제로 보이면 성공입니다. 안 보이면 손 드세요.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">02</div><div class=\"ct\">첫 줄에 내 문장이 있나요</div><div class=\"cb\">CLAUDE.md를 열어보세요. 첫 줄에 <strong>내가 쓴 문장</strong>이 그대로 들어가 있습니다. 손으로 한번 가리켜보세요.</div></div>\n  </div>\n  \n</div>"},
{notes:"폴더가 통째로 생겼다. 노란 NEW만 짚는다. SKILL.md는 아직 비어 있다는 걸 손으로 가리키고 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">아키텍처 1단계</div>\n  <div class=\"h2\" style=\"font-size:25px;\">방과 배경이 생겼습니다</div>\n  <div class=\"demo\" style=\"margin-top:12px;padding:14px 18px;\">\n    <div class=\"dlbl\">방</div>\n    <div style=\"display:flex;gap:12px;\"><div class=\"agbox\" style=\"flex:1;animation-delay:0.1s;text-align:center;border-color:#7C3AED;background:rgba(124,58,237,.14);\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">1번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;\">Code 탭 · 파일을 만듭니다</div></div><div style=\"flex:1;border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:rgba(255,255,255,.22);\">2번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.18);margin-top:3px;\">실습 3에서</div></div></div>\n    <div style=\"text-align:center;font-size:12px;color:#A78BFA;margin:10px 0 8px;\">↓&nbsp;&nbsp;1번 방이 이 폴더를 봅니다&nbsp;&nbsp;↓</div>\n    <div class=\"dlbl\">폴더 — 둘이 같이 쓰는 폴더</div>\n    <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:11px 14px;\"><div class=\"fline\" style=\"animation-delay:0.5s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">내_업무_폴더/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\"><span style=\"margin-left:8px;font-size:9.5px;font-weight:800;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.5700000000000001s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── CLAUDE.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이 방의 규칙. 모든 대화가 먼저 읽습니다<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.64s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── background.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">내 업무 배경 — 지난주 대화에서 옮겨온 것<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.71s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── SKILL.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">일하는 순서 다섯 칸</span></div><div class=\"fline\" style=\"animation-delay:0.78s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── input/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이번에 처리할 원본 자료<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.8500000000000001s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">└── output/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">결과물이 나오는 곳<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.92s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    ├── draft.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">1번 방이 낸 초안</span></div><div class=\"fline\" style=\"animation-delay:0.99s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    └── review.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">2번 방이 낸 지적 목록</span></div></div>\n  </div>\n</div>"},
{notes:"실제 사례. 매일 아침 뉴스 50건을 10건으로 줄이던 분. 머릿속 기준이 글이 되는 순간을 보여준다. (말로: 머릿속에만 있던 기준을 적어놓으니 그대로 AI한테 주면 됐습니다.)",html:"<div class=\"inner\">\n  <div class=\"kicker\">사례 A · 뉴스 클리핑</div>\n  <div class=\"h2\">머릿속 기준을 글로 꺼냈더니</div>\n  <div class=\"sub\">홍보 담당자 · 매일 아침 뉴스 50건을 읽고 10건을 골라 한 문장씩 요약해 110명에게 메일 보내던 일</div>\n  <div class=\"g2\" style=\"margin-top:12px;\">\n    <div class=\"card am\"><div class=\"ctag am\">왜 필요했나</div><div class=\"cb\">고르는 기준과 문장 쓰는 습관이 본인 머릿속에만 있었습니다. 빠뜨리면 왜 빠졌냐는 말을 듣는 자리였고, 본인이 자리를 비우면 아무도 대신 못 했습니다.</div></div>\n    <div class=\"card gr\"><div class=\"ctag gr\">적어보니 이렇게 나왔습니다</div><div class=\"cb\"><strong>고를 때</strong> 우리 기관이 나오면 무조건 넣는다 / 예산·제도 얘기는 되도록 넣는다 / 같은 사안이 세 번째 나오면 뺀다<br/><strong>쓸 때</strong> 한 기사에 딱 한 문장 / 매체 이름 위치를 돌려가며 쓴다 / 문장 끝을 계속 바꾼다</div></div>\n  </div>\n  \n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 순서를 쥐여주고, 실제로 한 번 돌립니다. 여기서 Agent가 완성됩니다.",html:"<div class=\"inner divslide\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">03</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">오늘 ① · 16–36분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">Agent를 만듭니다</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">순서를 쥐여주고, 실제로 한 번 돌립니다. 여기서 Agent가 완성됩니다.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 1</div>\n    </div>\n  </div>\n</div>"},
{notes:"Agent가 챗봇과 뭐가 다른지 한 장으로 끝낸다. 핵심은 '답하고 끝'이 아니라 '계획-실행-검토-수정을 스스로 돈다'는 것. 그래서 만들 때 중요한 게 무엇을 만들지보다 무엇을 기준으로 다시 확인할지라는 문장을 꼭 읽어준다. 이 문장이 뒤의 검수 방과 이어진다.",html:"<div class=\"inner\" style=\"max-width:1100px;\">\n  <div class=\"kicker\">개념 · Agent vs 챗봇</div>\n  <div class=\"h2\" style=\"font-size:25px;\">스스로 다시 확인하면 Agent</div>\n  <div class=\"ba\" style=\"margin-top:14px;\">\n    <div class=\"bef\"><div class=\"balbl b\">챗봇</div><div class=\"batask\">질문 하나 → 답 하나 → 끝</div><div class=\"babody\">맞는지 틀렸는지는 사람이 봅니다. 다음에 또 물어보면 처음부터 다시 설명해야 합니다.</div></div>\n    <div class=\"aft\"><div class=\"balbl a\">Agent</div><div class=\"batask\">목표 하나 → 스스로 돕니다</div><div class=\"babody\">계획을 세우고, 파일을 읽고 쓰고, 결과를 자기가 점검하고, 안 되면 다시 합니다.</div></div>\n  </div>\n  <div class=\"demo\" style=\"margin-top:14px;padding:14px 16px;\">\n    <div class=\"dlbl\">Agent가 도는 네 단계</div>\n    <div style=\"display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr 24px 1fr;gap:6px;align-items:center;\">\n      <div class=\"agbox\" style=\"text-align:center;animation-delay:.1s\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">① 맥락 모으기</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">폴더와 규칙부터 읽습니다</div></div>\n      <div style=\"text-align:center;color:rgba(255,255,255,.3);\">→</div>\n      <div class=\"agbox\" style=\"text-align:center;animation-delay:.35s\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">② 행동</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">파일을 쓰고 명령을 실행</div></div>\n      <div style=\"text-align:center;color:rgba(255,255,255,.3);\">→</div>\n      <div class=\"agbox\" style=\"text-align:center;animation-delay:.6s\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">③ 결과 확인</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">원하는 게 나왔는지 스스로 점검</div></div>\n      <div style=\"text-align:center;color:rgba(255,255,255,.3);\">↻</div>\n      <div class=\"agbox\" style=\"text-align:center;animation-delay:.85s\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">④ 반복</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">끝났거나 사람 확인이 필요할 때 멈춤</div></div>\n    </div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">그래서 만들 때 중요한 건</div><div class=\"bmtxt\"><span class=\"hl\">다시 확인할 기준</span>이 있어야 합니다<br/>③이 없으면 Agent가 아닙니다</div></div>\n</div>"},
{notes:"Skill 다섯 칸. 3번이 제일 중요하다고 짚는다. 이 칸들을 수강생이 채우는 게 아니라는 건 다음 장에서 말한다.",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">Agent 만들기 · Skill <span style=\"font-weight:600;color:rgba(167,139,250,.9);\">(SKILL.md)</span></div>\n  <div class=\"h2\">일하는 순서를 다섯 칸으로</div>\n  <div class=\"sub\">순서를 다섯 칸으로 적습니다. 이게 Skill 한 장입니다.</div>\n  <table class=\"tbl\" style=\"margin-top:10px;\">\n    <thead><tr><th style=\"width:130px\">칸</th><th>여기에 뭘 적나</th><th style=\"width:270px\">비어 있으면 이렇게 됩니다</th></tr></thead>\n    <tbody>\n      <tr><td>1. 이름</td><td>이 일을 한 줄로 부르는 이름</td><td>이름이 안 나오면 일이 아직 너무 큽니다</td></tr>\n      <tr><td>2. 넣는 것</td><td>시작에 필요한 자료 + 이 일을 왜 하는지</td><td>자료만 주면 뻔한 말이 나옵니다</td></tr>\n      <tr class=\"focal\"><td class=\"done\">3. 순서</td><td class=\"done\">내가 실제로 밟는 단계와 판단 기준</td><td class=\"warn\">일반론이 나옵니다. 여기가 제일 중요합니다</td></tr>\n      <tr><td>4. 나오는 것</td><td>결과물 모양을 예시까지</td><td>매번 다른 모양이 나옵니다</td></tr>\n      <tr><td>5. 내가 볼 곳</td><td>내가 마지막에 확인할 지점</td><td>확인 없이 그냥 나갑니다</td></tr>\n    </tbody>\n  </table>\n</div>"},
{notes:"이 장표의 메시지는 하나다 — 여러분이 안 채웁니다. AI가 background.md 보고 먼저 다 쓰고, 근거 없는 칸만 하나씩 물어봅니다. 오른쪽 애니메이션을 그냥 보게 둔다.",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">Agent 만들기 · 역할</div>\n  <div class=\"h2\" style=\"font-size:25px;\">다섯 칸은 AI가 채웁니다</div>\n  <div class=\"sub\">아까 만든 background.md를 보고 <strong>AI가 먼저 다 씁니다.</strong> 근거가 없는 칸만 하나씩 물어봅니다.</div>\n  <div style=\"max-width:720px;margin:16px auto 0;\"><div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n  <div class=\"dlbl\">AI가 이렇게 채웁니다</div>\n  <div class=\"slotrow\"><b>1. 이름</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:.6s\">…</span><span class=\"rv mono\" style=\"animation-delay:.7s\">회의록 정리</span></div></div>\n  <div class=\"slotrow\"><b>2. 넣는 것</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:1.0s\">…</span><span class=\"rv mono\" style=\"animation-delay:1.1s\">회의 원문 + 참석자</span></div></div>\n  <div class=\"slotrow\"><b>3. 순서</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:1.4s\">…</span><span class=\"rv mono\" style=\"animation-delay:1.5s\">결정된 것만 → 담당자 → 기한</span></div></div>\n  <div class=\"slotrow ask\"><b>4. 나오는 것</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:1.8s\">…</span><span class=\"rv mono\" style=\"animation-delay:1.9s\">비었습니다 — 물어볼게요</span></div></div>\n  <div class=\"slotrow\"><b>5. 내가 볼 곳</b><div class=\"slotval\"><span class=\"ph mono\" style=\"animation-delay:2.2s\">…</span><span class=\"rv mono\" style=\"animation-delay:2.3s\">발송 전 담당자 확인</span></div></div>\n  <div class=\"bubble\" style=\"animation-delay:2.9s;margin-top:10px;margin-bottom:0;font-size:12px;\">결과물은 어떤 모양이어야 하나요? <strong>하나씩만 물어봅니다.</strong></div>\n</div></div></div>"},
{notes:"복붙시키고 8분 준다. 돌아가는 동안 AI가 하나씩 물어볼 거라고 미리 말해준다. 한꺼번에 물어보면 초보가 멈춘다. [용어 짚기: Skill · SKILL.md] 한 문장만 읽고 바로 넘어간다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">Agent 만들기 · 프롬프트</div>\n  <div class=\"h2\">AI가 쓰고, 나는 고칩니다</div>\n  <pre class=\"prompt\">background.md 를 읽고,\n그 내용을 근거로 SKILL.md 를 대신 써줘.\n\n다섯 칸으로 만들어줘.\n1. 이름       이 일을 한 줄로 부르는 이름\n2. 넣는 것     있어야 시작되는 자료와 이 일을 하는 이유\n3. 순서       내가 실제로 밟는 단계를 번호로\n4. 나오는 것   결과물 모양을 예시까지\n5. 내가 볼 곳  내가 마지막에 확인해야 할 지점\n\n규칙:\n- background.md에 있는 내용으로만 채워.\n- 근거가 없는 칸은 비워두고 맨 아래에 \"내가 답해야 할 것\"으로 모아줘.\n- 그 목록은 한 번에 하나씩 물어봐줘. 한꺼번에 다 묻지 마.\n- 추측해서 채우지 마.\n\n다 써준 다음, 내가 꼭 봐야 할 줄 3개만 골라서 알려줘.</pre>\n\n  <div class=\"term\"><span class=\"tt\">용어</span><span class=\"tb\"><b>업무 하나를 처리하는 절차서 한 장</b>입니다. Agent가 일하는 사람이면, Skill은 그 사람이 보는 업무 매뉴얼.</span></div>\n</div>"},
{notes:"검수 한 번은 반드시 시킨다. 그냥 넘어가면 내 파일이 아니라 AI가 만든 일반론이 된다. 몇 명에게 고친 줄을 소리 내어 읽게 하면 좋다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">Agent 만들기 · 내 할 일</div>\n  <div class=\"h2\">세 가지만</div>\n  <div class=\"g3\" style=\"margin-top:16px;\">\n    <div class=\"card bl\"><div class=\"ctag bl\">01</div><div class=\"ct\">물어보면 답하기</div><div class=\"cb\">AI가 비워둔 칸을 하나씩 물어봅니다. 생각나는 대로 답하면 됩니다.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">02</div><div class=\"ct\">3줄 읽기</div><div class=\"cb\">꼭 봐야 할 줄 3개를 알려줍니다. 그것만 읽어보세요.</div></div>\n    <div class=\"card gr\"><div class=\"ctag gr\">03</div><div class=\"ct\">한 줄 고치기</div><div class=\"cb\">틀린 게 있으면 말로 고쳐달라고 하세요. 타자 칠 일 없습니다.</div></div>\n  </div>\n  <div class=\"bigmsg\"><div class=\"bmlbl\">확인 포인트</div><div class=\"bmtxt\"><span class=\"hl\">한 줄만 고쳐보세요.</span> 그 한 줄이 이게 여러분 거라는 표시입니다.<br/>하나도 안 고쳤으면 아직 읽지 않은 겁니다.</div></div>\n</div>"},
{notes:"오늘 가장 중요한 장표. 여기서 처음으로 Agent가 실제로 일을 한다. 돌아가는 동안 화면을 바꾸지 말고 그냥 보게 둔다. draft.md가 열리는 순간이 'Agent를 만들었다'의 증거다. 여기까지 온 사람만 멀티로 넘어갈 수 있으니 손 든 사람 먼저 챙긴다. (말로: draft.md가 생기면 된 겁니다.)",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">Agent 만들기 · 실행 <span style=\"font-weight:600;color:rgba(167,139,250,.9);\">(Agent 루프)</span></div>\n  <div class=\"h2\" style=\"font-size:25px;\">한 번 돌립니다 → draft.md</div>\n  <div class=\"sub\">적어둔 것만으로는 아직 아닙니다. <strong>그 순서대로 돌려서 결과가 나와야</strong> 합니다.</div>\n  <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start;margin-top:12px;\">\n    <div>\n      <pre class=\"prompt\" style=\"font-size:13px;\">input 에 이번에 처리할 자료를 넣었어.\n(자료가 없으면: 내 업무에서 흔한 예시 하나를 네가 만들어서 써)\n\nSKILL.md 순서대로 그 일을 한 번 해줘.\n\n결과는 output/draft.md 로 저장해줘.\n모르는 건 추측하지 말고 \"확인 필요\"라고 적어둬.</pre>\n      \n    </div>\n    <div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">이 순간을 보세요</div>\n      <div class=\"mono\" style=\"font-size:11.5px;\">\n        <div class=\"fline\" style=\"animation-delay:.4s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>SKILL.md 읽는 중</div>\n        <div class=\"fline\" style=\"animation-delay:.9s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>background.md 읽는 중</div>\n        <div class=\"fline\" style=\"animation-delay:1.4s;color:rgba(255,255,255,.55)\"><i style=\"background:#334155\"></i>input 읽는 중</div>\n        <div class=\"fline\" style=\"animation-delay:1.9s;color:rgba(252,211,77,.9)\"><i style=\"background:#78350F\"></i>순서 3단계 진행 중…</div>\n        <div class=\"fline fn\" style=\"animation-delay:2.6s;font-weight:700;\"><i></i>output/draft.md</div>\n      </div>\n      <div class=\"bubble\" style=\"animation-delay:3.2s;margin-top:10px;margin-bottom:0;font-size:12px;\">제가 안 보는 동안 <strong>순서대로 혼자 했습니다.</strong></div>\n    </div>\n  </div>\n</div>"},
{notes:"SKILL.md 한 줄만 새로 켜진다. Agent 만들기가 한 일이 딱 이 한 줄이라는 걸 보여주면 \"내가 뭘 한 거지\" 하던 사람이 정리된다.",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">아키텍처 2단계</div>\n  <div class=\"h2\" style=\"font-size:25px;\">Agent 하나 완성</div>\n  <div class=\"demo\" style=\"margin-top:12px;padding:14px 18px;\">\n    <div class=\"dlbl\">방</div>\n    <div style=\"display:flex;gap:12px;\"><div class=\"agbox\" style=\"flex:1;animation-delay:0.1s;text-align:center;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.04);\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">1번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;\">순서대로 일합니다</div></div><div style=\"flex:1;border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:rgba(255,255,255,.22);\">2번 방</div><div style=\"font-size:11px;color:rgba(255,255,255,.18);margin-top:3px;\">실습 3에서</div></div></div>\n    <div style=\"text-align:center;font-size:12px;color:#A78BFA;margin:10px 0 8px;\">↓&nbsp;&nbsp;1번 방이 이 폴더를 봅니다&nbsp;&nbsp;↓</div>\n    <div class=\"dlbl\">폴더 — 둘이 같이 쓰는 폴더</div>\n    <div style=\"background:rgba(0,0,0,.26);border-radius:9px;padding:11px 14px;\"><div class=\"fline\" style=\"animation-delay:0.5s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">내_업무_폴더/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\"></span></div><div class=\"fline\" style=\"animation-delay:0.5700000000000001s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── CLAUDE.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이 방의 규칙. 모든 대화가 먼저 읽습니다</span></div><div class=\"fline\" style=\"animation-delay:0.64s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── background.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">내 업무 배경 — 지난주 대화에서 옮겨온 것</span></div><div class=\"fline\" style=\"animation-delay:0.71s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── SKILL.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">일하는 순서 다섯 칸<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.78s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">├── input/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">이번에 처리할 원본 자료</span></div><div class=\"fline\" style=\"animation-delay:0.8500000000000001s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.74);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">└── output/</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">결과물이 나오는 곳</span></div><div class=\"fline\" style=\"animation-delay:0.92s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:#C4B5FD;font-weight:700;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    ├── draft.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.5);\">1번 방이 낸 초안<span style=\"margin-left:8px;font-size:9.5px;font-weight:800;background:#7C3AED;color:#fff;border-radius:4px;padding:1px 5px;\">NEW</span></span></div><div class=\"fline\" style=\"animation-delay:0.99s;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:2px 0;color:rgba(255,255,255,.20);font-weight:500;\"><span class=\"mono\" style=\"font-size:13px;white-space:pre;\">    └── review.md</span><span style=\"font-size:12px;color:rgba(255,255,255,.20);\">2번 방이 낸 지적 목록</span></div></div>\n  </div>\n</div>"},
{notes:"사례 B. 다섯 가지를 외우고 있던 게 머릿속 기준이었고, 목록으로 적으니 그대로 쓸 수 있게 됐다. 이 다섯 개가 다음 블록 검사하는 역할의 원형이다. (말로: 이 다섯 개가 잠시 뒤 검사하는 사람이 볼 기준이 됩니다.)",html:"<div class=\"inner\">\n  <div class=\"kicker\">사례 B · 규정 검토</div>\n  <div class=\"h2\">다섯 관점을 목록으로</div>\n  <div class=\"sub\">규정 담당자 · 규정 개정안을 볼 때마다 머릿속으로 돌리던 다섯 가지 관점</div>\n  <div class=\"ba\" style=\"margin-top:12px;\">\n    <div class=\"bef\"><div class=\"balbl b\">적기 전</div><div class=\"batask\">사람마다 빠뜨리는 게 달랐습니다</div><div class=\"babody\">다섯 가지가 머릿속에만 있어서 매번 처음부터 다시 생각했고, 바쁘면 한두 개를 빠뜨렸습니다.</div></div>\n    <div class=\"aft\"><div class=\"balbl a\">적은 뒤</div><div class=\"batask\">항상 다섯 개가 다 나옵니다</div><div class=\"babody\">개정안 파일을 넣으면 다섯 관점별로 검토 의견 초안이 나옵니다. 최종 제출 전 본인 확인은 그대로 남겼습니다.</div></div>\n  </div>\n  <div class=\"g3\" style=\"margin-top:12px;\">\n    <div class=\"card sl\"><div class=\"cb\"><strong>1</strong> 상위 법령과 어긋나지 않는가<br/><strong>2</strong> 예산과 맞는가</div></div>\n    <div class=\"card sl\"><div class=\"cb\"><strong>3</strong> 현장에서 실제로 되는가<br/><strong>4</strong> 빠져나갈 구멍은 없는가</div></div>\n    <div class=\"card sl\"><div class=\"cb\"><strong>5</strong> 기관 방향과 맞는가</div></div>\n  </div>\n  \n</div>"},
{notes:"간지. 3초만 띄우고 넘어간다. 여기부터가 Multi Agent입니다.",html:"<div class=\"inner divslide\" style=\"max-width:1000px;\">\n  <div style=\"display:flex;align-items:center;gap:26px;\">\n    <div style=\"font-size:92px;font-weight:900;line-height:1;color:rgba(124,58,237,.35);letter-spacing:-3px;\">04</div>\n    <div style=\"flex:1;\">\n      <div class=\"kicker\" style=\"margin-bottom:6px;\">오늘 ② · 36–52분</div>\n      <div class=\"h2\" style=\"font-size:40px;line-height:1.25;\">Multi Agent를 만듭니다</div>\n      <div style=\"height:3px;width:74px;background:#7C3AED;border-radius:2px;margin:16px 0 14px;\"></div>\n      <div class=\"sub\" style=\"font-size:16px;\">여기부터가 Multi Agent입니다.</div>\n    </div>\n    <div class=\"agbox\" style=\"min-width:130px;text-align:center;animation-delay:.2s;\">\n      <div style=\"font-size:11px;color:rgba(255,255,255,.45);\">지금까지</div>\n      <div style=\"font-size:26px;font-weight:900;color:#fff;margin-top:4px;\">agent 1 → 2</div>\n    </div>\n  </div>\n</div>"},
{notes:"어려운 이름 쓰지 않는다. \"방을 하나 더 연다\"로만 말한다. 1번 방은 지금 쓰던 창 그대로, 2번 방은 Code 탭에서 같은 폴더로 새 세션. 화면에서 새 세션 만드는 걸 한 번 보여주고 넘어간다. [용어 짚기: Multi Agent] 한 문장만 읽고 바로 넘어간다.",html:"<div class=\"inner\">\n  <div class=\"kicker\">Multi Agent · 시작 <span style=\"font-weight:600;color:rgba(167,139,250,.9);\">(Multi Agent)</span></div>\n  <div class=\"h2\">방을 하나 더 엽니다</div>\n  <div class=\"sub\">여기까지가 Agent 하나입니다. 자기가 쓴 건 자기가 봐도 틀린 게 잘 안 보입니다. <strong>방을 하나 더 열어서 검사만 시킵니다.</strong></div>\n  <div style=\"display:grid;grid-template-columns:1.15fr .95fr;gap:22px;align-items:start;margin-top:12px;\">\n    <div>\n      <div class=\"g2\" style=\"margin-top:0;\">\n        <div class=\"card bl\"><div class=\"ctag bl\">1번 방 — 지금 쓰던 창</div><div class=\"ct\">초안을 씁니다</div><div class=\"cb\">방금 만든 SKILL.md 순서대로 작업해서 <strong>output/draft.md</strong>를 냅니다.</div></div>\n        <div class=\"card pu\"><div class=\"ctag pu\">2번 방 — 새로 여는 창</div><div class=\"ct\">어긋난 곳만 찾습니다</div><div class=\"cb\"><strong>같은 폴더</strong>로 세션을 하나 더 엽니다. draft.md를 읽고 지적만 해서 <strong>review.md</strong>를 냅니다.</div></div>\n      </div>\n      <div class=\"cl am\">고칠지 말지는 <strong>내가</strong> 정합니다. 메일 보내기 같은 건 여기서 멈춥니다.</div>\n    </div>\n    <div><div class=\"demo card-pop\" style=\"animation-delay:.1s\">\n      <div class=\"dlbl\">둘이 이렇게 돕니다</div>\n      <div style=\"display:grid;grid-template-columns:1fr 26px 1fr;gap:8px;align-items:center;\">\n        <div class=\"agbox a1\"><div style=\"font-weight:800;color:#fff;font-size:13px;\">1번 방</div>\n          <div style=\"font-size:11.5px;color:rgba(255,255,255,.55);margin-top:3px;\">순서대로 초안</div>\n          <div class=\"fline fn mono\" style=\"animation-delay:1.4s;font-size:11.5px;margin-top:6px;\"><i></i>draft.md</div></div>\n        <div style=\"text-align:center;color:rgba(255,255,255,.3);font-size:18px;\">→</div>\n        <div class=\"agbox a2\"><div style=\"font-weight:800;color:#fff;font-size:13px;\">2번 방</div>\n          <div style=\"font-size:11.5px;color:rgba(255,255,255,.55);margin-top:3px;\">어긋난 곳만 지적</div>\n          <div class=\"fline fn mono\" style=\"animation-delay:3.2s;font-size:11.5px;margin-top:6px;\"><i></i>review.md</div></div>\n      </div>\n      <div class=\"bubble\" style=\"animation-delay:3.8s;margin-top:10px;margin-bottom:0;font-size:12px;\">draft.md는 <strong>그대로입니다.</strong> 지적만 했고 고치지 않았습니다.</div>\n    </div></div>\n  </div>\n\n  <div class=\"term\"><span class=\"tt\">용어</span><span class=\"tb\"><b>방이 둘 이상</b>이면 Multi Agent입니다. 어려운 이름이지만 오늘 하는 건 창 하나 더 여는 것뿐입니다.</span></div>\n</div>"},
{notes:"3주차 자료의 Head-Sub 구조 그대로. 오늘 만드는 건 이 구조의 가장 작은 버전이라고만 말하고 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">Multi Agent · 구조</div>\n  <div class=\"h2\" style=\"font-size:25px;\">Head 하나 + Sub 여럿</div>\n  <div class=\"demo\" style=\"margin-top:10px;padding:14px 16px;\">\n    <div style=\"display:flex;justify-content:center;\">\n      <div class=\"agbox\" style=\"animation-delay:.1s;min-width:290px;text-align:center;border-color:#7C3AED;background:rgba(124,58,237,.16);\">\n        <div style=\"font-weight:800;font-size:14px;color:#C4B5FD;\">Head Agent · 지휘</div>\n        <div style=\"font-size:11.5px;color:rgba(255,255,255,.55);margin-top:3px;\">목표를 쪼개 맡기고, 결과를 모아 판단합니다 — CLAUDE.md가 이 방의 규칙</div>\n      </div>\n    </div>\n    <div style=\"text-align:center;color:#A78BFA;font-size:16px;margin:6px 0;\">↓</div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;\">\n      <div class=\"agbox\" style=\"animation-delay:.4s;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">Sub A</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">조사 · 자료 수집</div></div>\n      <div class=\"agbox\" style=\"animation-delay:.6s;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">Sub B</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">작성 · 초안 생성</div></div>\n      <div class=\"agbox\" style=\"animation-delay:.8s;text-align:center;\"><div style=\"font-weight:800;font-size:13px;color:#fff;\">Sub C</div><div style=\"font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;\">검토 · 판정</div></div>\n    </div>\n    <div class=\"cl am\" style=\"margin:10px 0 0;font-size:12px;\">Sub는 <strong>자기 몫만</strong> 하고 결과만 돌려줍니다. 기억이 따로라 서로 사정을 모릅니다.</div>\n  </div>\n  </div>"},
{notes:"네 가지를 외우게 하지 않는다. 내 업무가 이 중 뭐냐만 생각하게 한다. 오늘 만드는 게 순차형이라고 손으로 짚는다. (말로: 외우지 마세요. 내 업무가 이 넷 중 뭔지만 생각하시면 됩니다.)",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">Multi Agent · 연결 방식</div>\n  <div class=\"h2\" style=\"font-size:25px;\">순차 · 병렬 · 분기 · 반복</div>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px;\">\n    <div class=\"card gr\"><div class=\"ctag gr\">① 순차형</div><div class=\"ct\">앞이 끝나야 뒤가 시작</div><div class=\"cb\">조사 → 작성 → 검토. <strong>오늘 만드는 게 이것입니다.</strong></div></div>\n    <div class=\"card bl\"><div class=\"ctag bl\">② 병렬형</div><div class=\"ct\">서로 상관없는 일은 동시에</div><div class=\"cb\">각자 끝나면 지휘하는 쪽이 모읍니다</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">③ 분기형</div><div class=\"ct\">조건에 따라 다른 담당에게</div><div class=\"cb\">환불 문의는 정책 담당, 일반 문의는 FAQ 담당</div></div>\n    <div class=\"card am\"><div class=\"ctag am\">④ 반복형</div><div class=\"ct\">통과할 때까지 주고받기</div><div class=\"cb\">초안 → 검토 → 반영 → 재검토</div></div>\n  </div>\n  \n</div>"},
{notes:"여기가 오늘의 개념 정점이다. 방이 다르면 대화는 안 넘어간다 — 이건 준비 ②에서 이미 몸으로 겪었다(이전 프롬프트). 그런데 파일은 넘어간다. 그래서 폴더를 만든 거다. 준비 ②의 네 칸이 여기서 회수된다고 말해준다. [용어 짚기: 컨텍스트] 한 문장만 읽고 바로 넘어간다.",html:"<div class=\"inner\" style=\"max-width:1080px;\">\n  <div class=\"kicker\">Multi Agent · 원리 <span style=\"font-weight:600;color:rgba(167,139,250,.9);\">(컨텍스트)</span></div>\n  <div class=\"h2\" style=\"font-size:25px;\">대화는 안 넘어가고 파일만 넘어간다</div>\n  <div class=\"demo\" style=\"margin-top:12px;padding:14px 16px;\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n      <div class=\"agbox a1\" style=\"animation-delay:.1s\">\n        <div style=\"font-weight:800;color:#fff;font-size:13px;\">1번 방이 아는 것</div>\n        <div style=\"font-size:12px;color:rgba(255,255,255,.6);margin-top:5px;line-height:1.8;\">내 배경, 내 말투, 내가 왜 이렇게 썼는지<br/>— 대화를 처음부터 다 봤으니까</div>\n      </div>\n      <div class=\"agbox a2\" style=\"animation-delay:.5s\">\n        <div style=\"font-weight:800;color:#fff;font-size:13px;\">2번 방이 아는 것</div>\n        <div style=\"font-size:12px;color:rgba(255,255,255,.6);margin-top:5px;line-height:1.8;\">폴더 안에 있는 <strong>파일뿐</strong><br/>— 1번 방 대화는 한 줄도 못 봅니다</div>\n      </div>\n    </div>\n    <div class=\"cl pu\" style=\"margin-top:12px;margin-bottom:0;\">2번 방은 사정을 모르니까 기준대로만 봅니다. 그래서 <strong>봐주지 않습니다.</strong></div>\n  </div>\n  <div class=\"ba\" style=\"margin-top:14px;\">\n    <div class=\"bef\"><div class=\"balbl b\">한 방에서 하면</div><div class=\"batask\">\"이제 냉정하게 다시 봐줘\"</div><div class=\"babody\">아까 자기가 쓴 걸 자기가 봅니다. 왜 그렇게 썼는지 알고 있어서 대체로 통과시킵니다.</div></div>\n    <div class=\"aft\"><div class=\"balbl a\">방을 나누면</div><div class=\"batask\">아예 사정을 모르는 상태에서 봅니다</div><div class=\"babody\">부탁하는 게 아니라 <strong>구조로 막는 겁니다.</strong> 이게 프롬프트보다 훨씬 셉니다.</div></div>\n  </div>\n  \n\n  <div class=\"term\"><span class=\"tt\">용어</span><span class=\"tb\"><b>그 방이 지금 기억하고 있는 것 전부</b>입니다. 방이 다르면 컨텍스트도 다릅니다. 그래서 2번 방은 사정을 모릅니다.</span></div>\n</div>"},
{notes:"방 나누기를 자기 업무로 번역시키는 장표. 표를 다 읽지 말고 두 줄만 읽고, 나머지는 '여러분 업무는 뭐가 나옵니까' 하고 한 명 지목해서 말하게 한다. 규칙 두 줄이 핵심이다 — 중간에 파일이 나오면 나눌 수 있다 / 2번 방 질문은 항상 하나다. 이 장표에서 자기 걸 못 떠올리는 사람은 Multi Agent 만들기에서 막힌다. (말로: 30초만 생각해보세요. 내 일은 중간에 뭐가 나오나요. 그게 draft.md입니다.)",html:"<div class=\"inner\" style=\"max-width:1120px;\">\n  <div class=\"kicker\">Multi Agent · 내 업무면</div>\n  <div class=\"h2\" style=\"font-size:25px;\">이렇게 나눕니다</div>\n  <div class=\"sub\">1번 방이 <strong>파일 하나</strong>를 내고, 2번 방이 그 파일만 보고 판단합니다.</div>\n  <table class=\"tbl\" style=\"margin-top:14px;font-size:12.5px;\">\n    <thead><tr><th style=\"width:20%;\">내 업무</th><th style=\"width:38%;\">1번 방이 내는 것</th><th>2번 방이 보는 것</th></tr></thead>\n    <tbody>\n      <tr><td><strong>회의록 정리</strong></td><td>결정사항 · 담당자 · 기한</td><td>원문에 없는 말이 섞였는가, 담당자 없이 넘어간 항목이 있는가</td></tr>\n      <tr><td><strong>고객 문의 답변</strong></td><td>문의 유형 분류 + 답변 초안</td><td>확약하면 안 되는 표현이 들어갔는가 (환불 보장, 기한 약속)</td></tr>\n      <tr><td><strong>주간 보고</strong></td><td>이번 주 한 일 + 다음 주 할 일</td><td>확인 안 된 숫자가 있는가, 근거 없이 \"완료\"로 적힌 게 있는가</td></tr>\n      <tr><td><strong>뉴스 클리핑</strong></td><td>50건 중 고른 10건과 한 줄 요약</td><td>내가 정한 고르는 기준과 어긋난 건이 있는가</td></tr>\n    </tbody>\n  </table>\n  <div class=\"g2\" style=\"margin-top:14px;\">\n    <div class=\"card gr\"><div class=\"ctag gr\">나눌 수 있는지 판별하는 법</div><div class=\"cb\">일 중간에 <strong>파일 하나가 나오면</strong> 나눌 수 있습니다. 안 나오면 못 나눕니다. 넘길 물건이 없으니까요.</div></div>\n    <div class=\"card pu\"><div class=\"ctag pu\">2번 방의 질문은 늘 하나</div><div class=\"cb\">\"이대로 <strong>내 이름 걸고 나가도 되나?</strong>\" 여러분이 매번 마지막에 하던 그 걱정을 그대로 옮기면 됩니다.</div></div>\n  </div>\n  \n</div>"},
{notes:"두 번 붙인다. ①은 지금 창에, ②는 새로 연 창에. 새 세션 만들 때 폴더를 똑같이 고르는 게 유일한 함정이다 — 여기서 손 들 사람이 나오니 화면으로 한 번 보여준다. ②의 첫 줄 \"초안은 네가 쓴 게 아니야\"가 핵심이다. (말로: review.md가 초안을 안 고치고 지적만 했으면 된 겁니다.)",html:"<div class=\"inner\" style=\"max-width:1100px;\">\n  <div class=\"kicker\">Multi Agent · 프롬프트</div>\n  <div class=\"h2\" style=\"font-size:25px;\">방마다 한 번씩, 두 번</div>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;\">\n    <div>\n      <div class=\"ctag bl\" style=\"margin-bottom:6px;\">① 1번 방 — 지금 쓰던 창에 그대로</div>\n      <pre class=\"prompt\" style=\"font-size:12.5px;\">SKILL.md 순서대로\n이번 일을 한 번 해줘.\n\n결과는 output/draft.md 로 저장해줘.\n\n모르는 건 추측하지 말고\n\"확인 필요\"라고 적어둬.</pre>\n    </div>\n    <div>\n      <div class=\"ctag pu\" style=\"margin-bottom:6px;\">② 2번 방 — 같은 폴더로 새 세션을 연 뒤</div>\n      <pre class=\"prompt\" style=\"font-size:12.5px;\">너는 이 폴더의 <b>검사 담당</b>이야.\n초안은 네가 쓴 게 아니야.\n\n1. CLAUDE.md 와 SKILL.md 를 읽어.\n2. output/draft.md 를 그 기준과 비교해.\n3. 어긋난 곳만 output/review.md 에 적어.\n   표 세 칸: 어디가 | 뭐가 문제 | 왜\n\ndraft.md 는 <b>절대 고치지 마.</b> 지적만 해.</pre>\n    </div>\n  </div>\n  \n</div>"},
{notes:"지적 중에 내가 봐도 맞는 말이 하나라도 있으면 성공이다. 그 한 줄을 소리 내어 읽게 하면 체감이 크다. 세 번째 역할 얘기가 나오면 다음 시간으로 넘긴다. (말로: SKILL.md가 없어서 못 하신 분은 1번 방만 돌리세요. 하나만 돌아가도 오늘은 성공입니다.)",html:"<div class=\"inner\">\n  <div class=\"kicker\">Multi Agent · 체크</div>\n  <div class=\"h2\">맞는 지적이 하나라도 있으면 성공</div>\n  <div class=\"sub\">그 한 줄을 읽어보세요. 방 두 개가 나눠서 일한 결과입니다.</div>\n  <div class=\"g2\" style=\"margin-top:16px;\">\n    <div class=\"card gr\"><div class=\"ctag gr\">여기까지 왔으면</div><div class=\"cb\">output 안에 파일이 두 개 생겼습니다. 하나는 초안, 하나는 지적 목록. 만드는 방과 의심하는 방이 나뉘어 있습니다.</div></div>\n    <div class=\"card rd\"><div class=\"ctag rd\">오늘은 여기까지</div><div class=\"cb\">세 번째 방, 자동 반복, 어려운 이름. 전부 다음 시간입니다. 지금 더 나가면 지금까지 만든 것도 같이 흐려집니다.</div></div>\n  </div>\n  \n</div>"},
