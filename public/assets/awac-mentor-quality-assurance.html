<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>멘토링 Agent 품질 보증 구조</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f8f5;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#161916}
    main{height:100%;display:grid;grid-template-rows:auto 1fr;padding:30px 44px 24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#6c3bf2}.title{margin:7px 0 0;font-size:38px;line-height:1.15;letter-spacing:-.045em}.title span{color:#6c3bf2}svg{width:100%;height:100%;display:block}.arrow{stroke:#6f6878;stroke-width:2;fill:none}.loop{stroke:#6c3bf2;stroke-width:2.5;fill:none}.node{fill:white;stroke:#ded8e3;stroke-width:1.5}.head{fill:#f3edff;stroke:#6c3bf2;stroke-width:2}.agent{fill:#ffffff;stroke:#17141f;stroke-width:1.5}.gate{fill:#fff0e8;stroke:#ff7048;stroke-width:2}.memory{fill:#17131d;stroke:#17131d;stroke-width:1.5}.name{font-size:16px;font-weight:850;fill:#17141f}.sub{font-size:11px;font-weight:600;fill:#6f6878}.memory-name{font-size:16px;font-weight:850;fill:#ffad3d}.memory-sub{font-size:11px;font-weight:600;fill:#eee8f0}.skill{fill:#f5f1f7;stroke:#ded8e3;stroke-width:1}.skill-text{font-size:9px;font-weight:800;fill:#6c3bf2}.label-bg{fill:#faf8f5}.label{font-size:10px;font-weight:800;fill:#6f6878}.pass{font-size:10px;font-weight:850;fill:#6c3bf2}.fail{font-size:10px;font-weight:850;fill:#c34c33}
  </style>
</head>
<body>
<main>
  <header><div class="eyebrow">SOLUTION ARCHITECTURE / QUALITY ASSURANCE</div><h1 class="title">Agent가 만들고, <span>구조가 품질을 보증</span>합니다.</h1></header>
  <svg viewBox="0 0 1320 560" role="img" aria-labelledby="ttl desc">
    <title id="ttl">멘토링 Agent 품질 보증 아키텍처</title>
    <desc id="desc">Notion 입력을 Head Agent가 분배하고 네 Agent가 Skills를 사용해 결과물을 만든 뒤 자동 검수와 사람 승인을 거쳐 기록이 다음 실행으로 돌아간다.</desc>
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f6878"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6c3bf2"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c34c33"/></marker></defs>
    <path class="arrow" marker-end="url(#arrow)" d="M206 152 H274"/>
    <path class="arrow" d="M474 152 H526"/><path class="arrow" d="M526 152 V90 H586"/><path class="arrow" d="M526 152 V214 H586"/><path class="arrow" d="M526 152 V338 H586"/><path class="arrow" marker-end="url(#arrow)" d="M526 152 V462 H586"/>
    <path class="arrow" d="M804 90 H842 V214"/><path class="arrow" d="M804 214 H842"/><path class="arrow" d="M804 338 H842 V214"/><path class="arrow" d="M804 462 H842 V214"/><path class="arrow" marker-end="url(#arrow)" d="M842 214 H888"/>
    <path class="loop" marker-end="url(#blue)" d="M1084 214 H1136"/>
    <path class="arrow" marker-end="url(#arrow)" d="M1228 266 V372"/>
    <path class="loop" marker-end="url(#blue)" d="M1132 432 H474 V206"/>
    <path stroke="#c34c33" stroke-width="2" fill="none" marker-end="url(#red)" d="M986 270 V504 H804"/>
    <rect class="label-bg" x="954" y="494" width="120" height="22"/><text class="fail" x="1014" y="509" text-anchor="middle">불일치 재실행</text>
    <rect class="label-bg" x="1082" y="194" width="100" height="22"/><text class="pass" x="1132" y="209" text-anchor="middle">통과</text>
    <rect class="node" x="36" y="102" width="170" height="100" rx="8"/><text class="name" x="121" y="136" text-anchor="middle">입력 자료</text><text class="sub" x="121" y="161" text-anchor="middle">Notion 제출물</text><text class="sub" x="121" y="181" text-anchor="middle">지난 피드백과 기준 문서</text>
    <rect class="head" x="274" y="96" width="200" height="112" rx="8"/><text class="name" x="374" y="132" text-anchor="middle">Head Agent</text><text class="sub" x="374" y="157" text-anchor="middle">작업 분배와 결과 취합</text><rect class="skill" x="316" y="172" width="116" height="22" rx="4"/><text class="skill-text" x="374" y="187" text-anchor="middle">weekly-ops</text>
    <rect class="agent" x="586" y="42" width="218" height="96" rx="8"/><text class="name" x="695" y="72" text-anchor="middle">진단 Agent</text><text class="sub" x="695" y="94" text-anchor="middle">핵심 문제와 우선순위</text><rect class="skill" x="614" y="106" width="162" height="22" rx="4"/><text class="skill-text" x="695" y="121" text-anchor="middle">feedback-classifier</text>
    <rect class="agent" x="586" y="166" width="218" height="96" rx="8"/><text class="name" x="695" y="196" text-anchor="middle">PDF Agent</text><text class="sub" x="695" y="218" text-anchor="middle">피드백 리포트</text><rect class="skill" x="614" y="230" width="162" height="22" rx="4"/><text class="skill-text" x="695" y="245" text-anchor="middle">pdf-formatter</text>
    <rect class="agent" x="586" y="290" width="218" height="96" rx="8"/><text class="name" x="695" y="320" text-anchor="middle">멘트 Agent</text><text class="sub" x="695" y="342" text-anchor="middle">Slack 전달 멘트</text><rect class="skill" x="614" y="354" width="162" height="22" rx="4"/><text class="skill-text" x="695" y="369" text-anchor="middle">slack-mention</text>
    <rect class="agent" x="586" y="414" width="218" height="96" rx="8"/><text class="name" x="695" y="444" text-anchor="middle">검수 Agent</text><text class="sub" x="695" y="466" text-anchor="middle">진단과 문장 일치 확인</text><rect class="skill" x="614" y="478" width="162" height="22" rx="4"/><text class="skill-text" x="695" y="493" text-anchor="middle">consistency-check</text>
    <rect class="gate" x="888" y="158" width="196" height="112" rx="8"/><text class="name" x="986" y="194" text-anchor="middle">자동 품질 게이트</text><text class="sub" x="986" y="219" text-anchor="middle">진단 일치, 행동 가능성</text><text class="sub" x="986" y="239" text-anchor="middle">톤 구분, 발송 안전성</text>
    <rect class="gate" x="1136" y="158" width="168" height="108" rx="8"/><text class="name" x="1220" y="194" text-anchor="middle">멘토 승인</text><text class="sub" x="1220" y="219" text-anchor="middle">최종 판단과 표현</text><text class="sub" x="1220" y="239" text-anchor="middle">외부 발송 여부</text>
    <rect class="memory" x="1132" y="372" width="176" height="120" rx="8"/><text class="memory-name" x="1220" y="408" text-anchor="middle">기억층</text><text class="memory-sub" x="1220" y="434" text-anchor="middle">검수 기록과 수정 이유</text><text class="memory-sub" x="1220" y="454" text-anchor="middle">다음 확인 포인트</text><text class="memory-sub" x="1220" y="474" text-anchor="middle">다음 실행의 입력</text>
  </svg>
</main>
</body>
</html>
